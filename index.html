<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Projects</title>
  <style>
    :root {
      --bg-sidebar: #F7F7F5;
      --bg-main: #FFFFFF;
      --bg-hover: rgba(55, 53, 47, 0.08);
      --text-main: #37352F;
      --text-muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.09);
      --btn-blue: #2383E2;
      --btn-blue-hover: #1A73CC;
      --tag-default: #E3E2E0;
      --tag-blue: #D3E5EF;
      --tag-orange: #FADEC9;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-serif: Lyon-Text, Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
    }
    
    /* サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      flex-shrink: 0;
    }
    .workspace-switcher {
      padding: 8px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .workspace-switcher:hover {
      background-color: var(--bg-hover);
    }
    .logo-text {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo-icon-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .nav-item {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background-color: var(--bg-hover);
    }
    .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
      font-weight: 500;
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .page-title {
      font-size: 16px;
      font-weight: 600;
    }
    .btn-primary {
      background-color: var(--btn-blue);
      color: #FFF;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: var(--btn-blue-hover);
    }

    /* カンバンボード */
    .board-container {
      padding: 24px 32px;
      flex: 1;
      overflow-x: auto;
    }
    .kanban-board {
      display: flex;
      gap: 16px;
      min-width: 900px;
      height: 100%;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .badge {
      background: var(--tag-default);
      padding: 0 6px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
    }

    /* カード */
    .card {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      box-shadow: rgba(15, 15, 15, 0.05) 0px 1px 2px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .card:hover {
      background-color: var(--bg-sidebar);
    }
    .c-id {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .c-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .c-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text-main);
    }
    .tag-draft { background-color: var(--tag-default); }
    .tag-sub { background-color: var(--tag-blue); }
    .tag-alert { background-color: var(--tag-orange); }

    /* モーダル共通 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 15, 15, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #FFFFFF;
      width: 520px;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: rgba(15, 15, 15, 0.1) 0px 0px 0px 1px, rgba(15, 15, 15, 0.2) 0px 5px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--btn-blue);
      box-shadow: rgba(35, 131, 226, 0.2) 0px 0px 0px 2px;
    }
    .form-readonly {
      background-color: var(--bg-sidebar);
      cursor: not-allowed;
      color: var(--text-muted);
    }
    .modal-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background-color: #FAFAFA;
    }
    .btn-secondary {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .open-file-link {
      font-size: 13px;
      color: var(--btn-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .open-file-link:hover {
      text-decoration: underline;
    }
    .memo-history {
      background-color: var(--bg-sidebar);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.4;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    /* ローディングスピナー */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- サイドバー -->
  <nav class="sidebar">
    <div class="workspace-switcher">
      <svg class="logo-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 35 L50 20 L80 35 L80 70 L50 85 L20 70 Z" fill="#000000"/>
        <path d="M23 35 L50 22 L77 35 L50 48 Z" fill="#FFFFFF"/>
        <path d="M23 38 L48 50 L48 80 L23 68 Z" fill="#FFFFFF"/>
        <path d="M52 50 L77 38 L77 68 L52 80 Z" fill="#E3E2E0"/>
        <text x="35.5" y="53" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#000000" text-anchor="middle" transform="skewY(25)">B</text>
      </svg>
      <div class="logo-text">Buddy</div>
    </div>
    <div class="nav-item">🏠 Dashboard</div>
    <div class="nav-item active">📂 Projects</div>
    <div class="nav-item">📅 Schedules</div>
  </nav>

  <!-- メインエリア -->
  <main class="main-content">
    <header class="top-header">
      <div class="page-title">Projects</div>
      <button class="btn-primary" onclick="openCreateModal()">+ New Project</button>
    </header>

    <div class="board-container">
      <div class="kanban-board">
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-draft">0</span> 1. Draft</div>
          <div id="col-draft" class="card-list"></div>
        </div>
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-submitted">0</span> 2. Submitted</div>
          <div id="col-submitted" class="card-list"></div>
        </div>
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-negotiating">0</span> 3. Negotiating</div>
          <div id="col-negotiating" class="card-list"></div>
        </div>
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-accepted">0</span> 4. Accepted</div>
          <div id="col-accepted" class="card-list"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 1. 案件編集・詳細モーダル -->
  <div class="modal-overlay" id="editModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="editModalTitle">Edit Project</span>
        <button class="close-btn" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <a id="editFileUrl" class="open-file-link" href="#" target="_blank">📄 見積書スプレッドシートを開く</a>
        </div>
        <div class="form-group">
          <label class="form-label">Client / 客先名</label>
          <input type="text" id="editClient" class="form-input form-readonly" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Amount / 見積金額</label>
          <input type="text" id="editAmount" class="form-input form-readonly" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Status / ステータス</label>
          <select id="editStatus" class="form-select">
            <option value="1. Draft">1. Draft (作成中)</option>
            <option value="2. Submitted">2. Submitted (提出済)</option>
            <option value="3. Negotiating">3. Negotiating (商談中)</option>
            <option value="4. Accepted">4. Accepted (受注・採用)</option>
            <option value="9. Lost / Cancelled">9. Lost / Cancelled (失注・中止)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Delivery Date / 納入希望日</label>
          <input type="date" id="editDeliveryDate" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Trade Type / 取引形態</label>
          <select id="editTradeType" class="form-select">
            <option value="直接取引(Direct)">直接取引(Direct)</option>
            <option value="通関業者経由(Via Forwarder)">通関業者経由(Via Forwarder)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Details / 見積内容</label>
          <textarea id="editDetails" class="form-textarea" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">New Memo / メモ追記</label>
          <input type="text" id="editNewMemo" class="form-input" placeholder="進捗・変更理由などを入力">
        </div>
        <div class="form-group">
          <label class="form-label">History / 変更履歴</label>
          <div id="editMemoHistory" class="memo-history"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn-primary" id="saveEditBtn" onclick="saveProjectUpdate()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- 2. 新規作成モーダル -->
  <div class="modal-overlay" id="createModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Create New Quote</span>
        <button class="close-btn" onclick="closeCreateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Category / 区分</label>
          <select id="createCategory" class="form-select">
            <option value="国内(Domestic)">国内 (Domestic)</option>
            <option value="輸出(Overseas)">輸出 (Overseas)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Trade Type / 取引形態</label>
          <select id="createTradeType" class="form-select">
            <option value="Direct">直接取引 (Direct)</option>
            <option value="Via Forwarder">通関業者経由 (Via Forwarder)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Delivery Date / 納入希望日 (※国内は手配期限を自動計算)</label>
          <input type="date" id="createDeliveryDate" class="form-input">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-primary" id="submitCreateBtn" onclick="submitCreateQuotation()">Create</button>
      </div>
    </div>
  </div>

  <!-- 3. 作成中ローディングオーバーレイ -->
  <div class="modal-overlay" id="loadingOverlay" style="z-index: 2000;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; color: #FFFFFF;">
      <div class="spinner"></div>
      <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.02em;">Creating quotation... Please wait</div>
    </div>
  </div>

  <!-- 4. 作成完了・確認モーダル (英語表記) -->
  <div class="modal-overlay" id="confirmModalOverlay" style="z-index: 1500;">
    <div class="modal-card" style="width: 440px; padding: 24px; box-sizing: border-box; text-align: center;">
      <div style="font-size: 32px; margin-bottom: 8px;">📋</div>
      <div style="font-size: 17px; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Quotation Created</div>
      <p id="confirmModalDesc" style="font-size: 13px; color: var(--text-muted); margin: 0 0 24px 0; line-height: 1.5;"></p>
      <div style="display: flex; justify-content: center; gap: 10px;">
        <button class="btn-secondary" onclick="closeConfirmModal()">Later</button>
        <button class="btn-primary" id="openSpreadsheetBtn">Open Spreadsheet</button>
      </div>
    </div>
  </div>

  <!-- スクリプト -->
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwP09q3UMN0Z5_x44kuSpTAiH3yiTPL49nNATYnVBp0SDP0ddbhfk82KlC4IZJ-CKlO/exec'; // 実際のGAS URL
    const API_SECRET = 'open ss1 rand kz'; // 設定したシークレットキー
    const CURRENT_EMP_ID = '10008';

    let currentProjects = [];
    let selectedQuoteNo = null;

    document.addEventListener('DOMContentLoaded', () => {
      fetchLatestProjects();
    });

    // 案件一覧の取得
    async function fetchLatestProjects() {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'searchProjects',
            query: '',
            apiKey: API_SECRET,
            empId: CURRENT_EMP_ID
          })
        });

        const result = await response.json();
        if (result.status === 'success') {
          currentProjects = result.data;
          renderKanbanBoard(currentProjects);
        } else {
          console.error('API Error:', result.message);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
      }
    }

    // カンバン描画
    function renderKanbanBoard(projects) {
      const colDraft = document.getElementById('col-draft');
      const colSubmitted = document.getElementById('col-submitted');
      const colNegotiating = document.getElementById('col-negotiating');
      const colAccepted = document.getElementById('col-accepted');
      
      [colDraft, colSubmitted, colNegotiating, colAccepted].forEach(col => col.innerHTML = '');

      const counts = { draft: 0, submitted: 0, negotiating: 0, accepted: 0 };

      projects.forEach(proj => {
        const amountDisplay = (proj.amount && proj.amount !== '0') ? proj.amount : '金額未定';
        
        let tagsHtml = `<span class="tag tag-draft">${proj.category || '未設定'}</span>`;
        if (proj.orderDeadline) {
           const formattedDate = proj.orderDeadline.substring(5);
           tagsHtml += `<span class="tag tag-alert">⚠️ Deadline: ${formattedDate}</span>`;
        }

        const cardHtml = `
          <div class="card" onclick="openEditModal('${proj.quoteNo}')">
            <div class="c-id">${proj.quoteNo}</div>
            <div class="c-title">${proj.client} / ${amountDisplay}</div>
            <div class="c-tags">${tagsHtml}</div>
          </div>
        `;

        const status = proj.status || '';
        if (status.includes('1. Draft')) {
          colDraft.insertAdjacentHTML('beforeend', cardHtml);
          counts.draft++;
        } else if (status.includes('2. Submitted')) {
          colSubmitted.insertAdjacentHTML('beforeend', cardHtml);
          counts.submitted++;
        } else if (status.includes('3. Negotiating')) {
          colNegotiating.insertAdjacentHTML('beforeend', cardHtml);
          counts.negotiating++;
        } else if (status.includes('4. Accepted')) {
          colAccepted.insertAdjacentHTML('beforeend', cardHtml);
          counts.accepted++;
        }
      });

      document.getElementById('badge-draft').textContent = counts.draft;
      document.getElementById('badge-submitted').textContent = counts.submitted;
      document.getElementById('badge-negotiating').textContent = counts.negotiating;
      document.getElementById('badge-accepted').textContent = counts.accepted;
    }

    // ----------------------------------------------------
    // 編集モーダルの制御
    // ----------------------------------------------------
    function openEditModal(quoteNo) {
      const proj = currentProjects.find(p => p.quoteNo === quoteNo);
      if (!proj) return;

      selectedQuoteNo = quoteNo;
      document.getElementById('editModalTitle').textContent = `Project: ${proj.quoteNo}`;
      document.getElementById('editFileUrl').href = proj.fileUrl || '#';
      document.getElementById('editClient').value = proj.client || '';
      document.getElementById('editAmount').value = proj.amount || '0';
      document.getElementById('editStatus').value = proj.status || '1. Draft';
      document.getElementById('editDeliveryDate').value = proj.deliveryDate || '';
      document.getElementById('editTradeType').value = proj.tradeType || '直接取引(Direct)';
      document.getElementById('editDetails').value = proj.details || '';
      document.getElementById('editNewMemo').value = '';
      document.getElementById('editMemoHistory').textContent = proj.memo || '履歴なし';

      document.getElementById('editModalOverlay').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModalOverlay').classList.remove('active');
      selectedQuoteNo = null;
    }

    async function saveProjectUpdate() {
      if (!selectedQuoteNo) return;
      const saveBtn = document.getElementById('saveEditBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const payload = {
        action: 'updateProject',
        apiKey: API_SECRET,
        empId: CURRENT_EMP_ID,
        quoteNo: selectedQuoteNo,
        status: document.getElementById('editStatus').value,
        deliveryDate: document.getElementById('editDeliveryDate').value,
        tradeType: document.getElementById('editTradeType').value,
        details: document.getElementById('editDetails').value,
        memo: document.getElementById('editNewMemo').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        if (res.status === 'success') {
          closeEditModal();
          await fetchLatestProjects();
        } else {
          alert('更新エラー: ' + res.message);
        }
      } catch (err) {
        alert('通信エラーが発生しました');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    }

    // ----------------------------------------------------
    // 新規作成モーダルの制御
    // ----------------------------------------------------
    function openCreateModal() {
      document.getElementById('createCategory').value = '国内(Domestic)';
      document.getElementById('createTradeType').value = 'Direct';
      document.getElementById('createDeliveryDate').value = '';
      document.getElementById('createModalOverlay').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('createModalOverlay').classList.remove('active');
    }

    async function submitCreateQuotation() {
      const payload = {
        action: 'createQuotation',
        apiKey: API_SECRET,
        empId: CURRENT_EMP_ID,
        isDomestic: document.getElementById('createCategory').value,
        tradeType: document.getElementById('createTradeType').value,
        deliveryDate: document.getElementById('createDeliveryDate').value
      };

      // 1. 入力モーダルを閉じ、ローディング画面を表示
      closeCreateModal();
      document.getElementById('loadingOverlay').classList.add('active');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        
        if (res.status === 'success') {
          // 2. カンバンボードを最新化
          await fetchLatestProjects();
          // 3. 英語の確認画面を表示
          showConfirmModal(res.quoteNo, res.fileUrl);
        } else {
          alert('Create Error: ' + res.message);
        }
      } catch (err) {
        alert('A network error occurred.');
      } finally {
        // ローディング画面を非表示化
        document.getElementById('loadingOverlay').classList.remove('active');
      }
    }

    // ----------------------------------------------------
    // 完了確認モーダル制御 (英語)
    // ----------------------------------------------------
    function showConfirmModal(quoteNo, fileUrl) {
      document.getElementById('confirmModalDesc').innerHTML = `Quotation <b>${quoteNo}</b> has been generated.<br>Would you like to open the spreadsheet now?`;
      
      const openBtn = document.getElementById('openSpreadsheetBtn');
      openBtn.onclick = () => {
        if (fileUrl) {
          window.open(fileUrl, '_blank');
        }
        closeConfirmModal();
      };

      document.getElementById('confirmModalOverlay').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
