<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotation Workspace — KATZDEN VIETNAM</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #ffffff;
      --text-main: #37352f;
      --text-muted: #787774;
      --text-placeholder: #9b9a97;
      --border-subtle: #edece9;
      --hover-bg: #efefed;
      --btn-dark: #232323;
      --btn-dark-hover: #000000;
      --accent-red: #c9171e;
      --callout-bg: #f7f6f3;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Notion Cover Banner */
    .notion-cover {
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, #f1f1ef 0%, #e8e7e4 100%);
      border-bottom: 1px solid var(--border-subtle);
    }

    /* Main Notion Page Container */
    .notion-page {
      width: 100%;
      max-width: 640px;
      padding: 0 40px 80px 40px;
      position: relative;
    }

    /* Notion Page Icon */
    .notion-icon-wrap {
      width: 72px;
      height: 72px;
      margin-top: -36px;
      margin-bottom: 20px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(15, 15, 15, 0.05);
      font-size: 34px;
    }

    /* Breadcrumbs / Top Workspace */
    .notion-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
    }

    .notion-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      line-height: 1.25;
    }

    /* Notion Properties (Key-Value Block) */
    .notion-properties {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 28px;
    }

    .prop-row {
      display: flex;
      align-items: center;
      min-height: 32px;
      font-size: 14px;
    }

    .prop-name {
      width: 150px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .prop-value {
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* Inputs styled like Notion cells */
    .notion-input {
      width: 100%;
      max-width: 260px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background: #fafaf9;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      outline: none;
      transition: all 0.15s ease;
    }

    .notion-input:focus {
      background: #ffffff;
      border-color: #2383e2;
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.15);
    }

    /* Notion Button */
    .notion-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: var(--btn-dark);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.1);
    }

    .notion-btn:hover {
      background: var(--btn-dark-hover);
    }

    .notion-btn:disabled {
      background: #e9e9e7;
      color: var(--text-placeholder);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* User Tag Badge */
    .notion-user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--hover-bg);
      padding: 4px 10px 4px 6px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
    }

    .user-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-red);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .btn-switch-user {
      margin-left: 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Notion Callout Block */
    .notion-callout {
      display: none;
      background: var(--callout-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 16px 18px;
      margin-top: 24px;
      text-align: left;
    }

    .callout-header {
      font-size: 13px;
      font-weight: 600;
      color: #287a4d;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .callout-body {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .link-notion-style {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #2383e2;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 10px;
      background: #ffffff;
      border: 1px solid #d3e5f7;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .link-notion-style:hover {
      background: #f0f7fe;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-muted);
      min-height: 20px;
    }
    .status-msg.error { color: #eb5757; }
    .status-msg.success { color: #287a4d; font-weight: 500; }

    .spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Cover -->
  <div class="notion-cover"></div>

  <!-- Page Body -->
  <div class="notion-page">
    <div class="notion-icon-wrap">📋</div>

    <div class="notion-breadcrumb">
      <span class="status-dot"></span>
      <span>KATZDEN VIETNAM</span>
      <span>/</span>
      <span>Sales & Operations</span>
    </div>

    <h1 class="notion-title">Quotation Workspace</h1>

    <!-- 1. ログインビュー -->
    <div id="loginView">
      <div class="notion-properties">
        <div class="prop-row">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Employee ID</span>
          </div>
          <div class="prop-value">
            <input type="text" id="empId" class="notion-input" placeholder="社員番号 (例: 0001)" autocomplete="off">
          </div>
        </div>
      </div>
      <button class="notion-btn" id="btnLogin">ログイン</button>
    </div>

    <!-- 2. ダッシュボードビュー -->
    <div id="dashView" style="display: none;">
      <div class="notion-properties">
        <div class="prop-row">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Created by</span>
          </div>
          <div class="prop-value">
            <div class="notion-user-badge">
              <span class="user-avatar" id="avatarLetter">T</span>
              <span id="dispName">--</span>
              <span style="color: var(--text-muted); font-size: 11px;" id="dispRole">(--)</span>
            </div>
            <button class="btn-switch-user" id="btnLogout">切替</button>
          </div>
        </div>
      </div>

      <button class="notion-btn" id="btnCreate">
        <div class="spin" id="btnSpinner"></div>
        <span id="btnText">＋ 新規見積書を作成</span>
      </button>

      <!-- コールアウト結果 -->
      <div class="notion-callout" id="resultBox">
        <div class="callout-header">✓ 生成完了</div>
        <div class="callout-body" id="dispQuoteNo"></div>
        <a href="#" target="_blank" class="link-notion-style" id="linkOpenSheet">
          <span>スプレッドシートを開く</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
  </div>

<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwP09q3UMN0Z5_x44kuSpTAiH3yiTPL49nNATYnVBp0SDP0ddbhfk82KlC4IZJ-CKlO/exec";
  const API_SECRET = "open ss1 rand kz";

  const STAFF_MASTER = {
    "0001": { name: "Tetsuya Goto", position: "Director" },
    "0002": { name: "Nguyen Tien Thinh", position: "Deputy Director" }
  };

  const loginView = document.getElementById("loginView");
  const dashView = document.getElementById("dashView");
  const empIdInput = document.getElementById("empId");
  const btnLogin = document.getElementById("btnLogin");
  const btnLogout = document.getElementById("btnLogout");
  const dispName = document.getElementById("dispName");
  const dispRole = document.getElementById("dispRole");
  const avatarLetter = document.getElementById("avatarLetter");
  const btnCreate = document.getElementById("btnCreate");
  const btnSpinner = document.getElementById("btnSpinner");
  const btnText = document.getElementById("btnText");
  const statusMsg = document.getElementById("statusMsg");
  const resultBox = document.getElementById("resultBox");
  const dispQuoteNo = document.getElementById("dispQuoteNo");
  const linkOpenSheet = document.getElementById("linkOpenSheet");

  let currentUser = null;

  const savedEmpId = localStorage.getItem("kz_emp_id");
  if (savedEmpId && STAFF_MASTER[savedEmpId]) {
    loginAs(savedEmpId);
  }

  btnLogin.addEventListener("click", () => {
    const id = empIdInput.value.trim();
    if (!id) {
      showStatus("社員番号を入力してください", "error");
      return;
    }
    if (STAFF_MASTER[id]) {
      localStorage.setItem("kz_emp_id", id);
      loginAs(id);
    } else {
      showStatus("該当する社員が見つかりません", "error");
    }
  });

  empIdInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") btnLogin.click();
  });

  function loginAs(id) {
    currentUser = STAFF_MASTER[id];
    currentUser.id = id;
    dispName.textContent = currentUser.name;
    dispRole.textContent = currentUser.position;
    avatarLetter.textContent = currentUser.name.charAt(0).toUpperCase();
    loginView.style.display = "none";
    dashView.style.display = "block";
    resultBox.style.display = "none";
    statusMsg.textContent = "";
  }

  btnLogout.addEventListener("click", () => {
    localStorage.removeItem("kz_emp_id");
    currentUser = null;
    empIdInput.value = "";
    dashView.style.display = "none";
    loginView.style.display = "block";
    statusMsg.textContent = "";
  });

  btnCreate.addEventListener("click", async () => {
    if (!currentUser) return;

    btnCreate.disabled = true;
    btnSpinner.style.display = "inline-block";
    btnText.textContent = "作成中...";
    statusMsg.className = "status-msg";
    statusMsg.textContent = "台帳に採番・フォルダ作成中 (約10秒)...";
    resultBox.style.display = "none";

    try {
      const response = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "createQuotation",
          empId: currentUser.id,
          apiKey: API_SECRET
        })
      });

      const res = await response.json();

      if (res.status === "success") {
        statusMsg.className = "status-msg success";
        statusMsg.textContent = "作成が完了しました";
        dispQuoteNo.textContent = res.quoteNo;
        linkOpenSheet.href = res.fileUrl;
        resultBox.style.display = "block";

        window.open(res.fileUrl, "_blank");
      } else {
        throw new Error(res.message || "作成に失敗しました");
      }
    } catch (err) {
      statusMsg.className = "status-msg error";
      statusMsg.textContent = err.message;
    } finally {
      btnCreate.disabled = false;
      btnSpinner.style.display = "none";
      btnText.textContent = "＋ 新規見積書を作成";
    }
  });

  function showStatus(text, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.textContent = text;
  }
</script>

</body>
</html>
