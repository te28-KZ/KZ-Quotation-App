<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATZDEN VIETNAM — Quotation System</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Notion-style Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23191919'/><path d='M30 28h22c9 0 15 5 15 13s-6 13-15 13h-9v18h-13V28zm13 18h8c4 0 7-2 7-5s-3-5-7-5h-8v10z' fill='%23ffffff'/></svg>">

  <style>
    :root {
      --bg: #f7f6f3;
      --card-bg: #ffffff;
      --text-main: #37352f;
      --text-muted: #787774;
      --text-light: #9b9a97;
      --border: #e9e9e7;
      --border-focus: #2eaadc;
      --primary: #2383e2;
      --hover-bg: #efefed;
      --success-bg: #edf6f1;
      --success-text: #287a4d;
      --mono-font: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 15, 15, 0.04), 0 6px 16px rgba(15, 15, 15, 0.03);
      padding: 36px 32px;
    }

    .header-section {
      margin-bottom: 24px;
      text-align: left;
    }

    .notion-icon-badge {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.05);
      transition: transform 0.15s ease;
    }
    .notion-icon-badge:hover {
      transform: scale(1.05);
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .workspace-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9171e;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .field-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field-label svg {
      width: 14px;
      height: 14px;
      color: var(--text-light);
    }

    .input-box {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.02);
    }

    .input-box:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(46, 170, 220, 0.2);
    }

    .input-box::placeholder {
      color: var(--text-light);
    }

    .btn-notion {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: #ffffff;
      background: #2383e2;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.08);
    }

    .btn-notion:hover {
      background: #1d73c9;
    }

    .btn-notion:active {
      transform: translateY(1px);
    }

    .btn-notion:disabled {
      background: #e9e9e7;
      color: #9b9a97;
      cursor: not-allowed;
      border-color: transparent;
      box-shadow: none;
    }

    .property-block {
      background: #fafaf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .property-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      background: #e3e2e0;
      color: var(--text-main);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .user-info {
      text-align: left;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
    }

    .user-role {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-switch {
      background: transparent;
      border: none;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .btn-switch:hover {
      background: var(--hover-bg);
      color: var(--text-main);
    }

    .callout {
      display: none;
      margin-top: 20px;
      background: var(--success-bg);
      border: 1px solid #d3e9db;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      animation: fadeIn 0.2s ease;
    }

    .callout-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--success-text);
      margin-bottom: 6px;
    }

    .quote-id {
      font-family: var(--mono-font);
      font-size: 15px;
      font-weight: 600;
      color: #1a5734;
      margin-bottom: 12px;
    }

    .btn-link-out {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #2383e2;
      text-decoration: none;
      padding: 6px 10px;
      background: #ffffff;
      border: 1px solid rgba(35, 131, 226, 0.25);
      border-radius: 6px;
      transition: background 0.15s;
    }

    .btn-link-out:hover {
      background: #f0f7fd;
    }

    .status-note {
      font-size: 12px;
      margin-top: 14px;
      min-height: 18px;
      color: var(--text-muted);
      text-align: center;
    }
    .status-note.error { color: #eb5757; }
    .status-note.success { color: #287a4d; font-weight: 500; }

    .spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: rotating 0.8s linear infinite;
      display: none;
    }

    @keyframes rotating {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <div class="notion-icon-badge">
      <!-- Minimalist Sheet & Pen Icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#37352f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <div class="page-title">Quotation Workspace</div>
    <div class="workspace-tag">
      <span class="dot"></span>
      <span>KATZDEN VIETNAM Co., Ltd.</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 1. ログイン -->
  <div id="loginView">
    <div class="field-group">
      <div class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>社員番号 / Employee ID</span>
      </div>
      <input type="text" id="empId" class="input-box" placeholder="例: 0001" autocomplete="off">
    </div>
    <button class="btn-notion" id="btnLogin">ログイン</button>
  </div>

  <!-- 2. ダッシュボード -->
  <div id="dashView" style="display: none;">
    <div class="property-block">
      <div class="property-user">
        <div class="avatar" id="avatarText">T</div>
        <div class="user-info">
          <div class="user-name" id="dispName">--</div>
          <div class="user-role" id="dispRole">--</div>
        </div>
      </div>
      <button class="btn-switch" id="btnLogout">切替</button>
    </div>

    <button class="btn-notion" id="btnCreate">
      <div class="spin" id="btnSpinner"></div>
      <span id="btnText">＋ 新規見積書を作成</span>
    </button>

    <!-- Notion風コールアウト -->
    <div class="callout" id="resultBox">
      <div class="callout-header">
        <span>✓ 作成完了</span>
      </div>
      <div class="quote-id" id="dispQuoteNo"></div>
      <a href="#" target="_blank" class="btn-link-out" id="linkOpenSheet">
        <span>スプレッドシートを開く</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  </div>

  <div class="status-note" id="statusMsg"></div>
</div>

<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwP09q3UMN0Z5_x44kuSpTAiH3yiTPL49nNATYnVBp0SDP0ddbhfk82KlC4IZJ-CKlO/exec";
  const API_SECRET = "open ss1 rand kz";

  const STAFF_MASTER = {
    "0001": { name: "Tetsuya Goto", position: "Director" },
    "0002": { name: "Nguyen Tien Thinh", position: "Deputy Director" }
  };

  const loginView = document.getElementById("loginView");
  const dashView = document.getElementById("dashView");
  const empIdInput = document.getElementById("empId");
  const btnLogin = document.getElementById("btnLogin");
  const btnLogout = document.getElementById("btnLogout");
  const dispName = document.getElementById("dispName");
  const dispRole = document.getElementById("dispRole");
  const avatarText = document.getElementById("avatarText");
  const btnCreate = document.getElementById("btnCreate");
  const btnSpinner = document.getElementById("btnSpinner");
  const btnText = document.getElementById("btnText");
  const statusMsg = document.getElementById("statusMsg");
  const resultBox = document.getElementById("resultBox");
  const dispQuoteNo = document.getElementById("dispQuoteNo");
  const linkOpenSheet = document.getElementById("linkOpenSheet");

  let currentUser = null;

  const savedEmpId = localStorage.getItem("kz_emp_id");
  if (savedEmpId && STAFF_MASTER[savedEmpId]) {
    loginAs(savedEmpId);
  }

  btnLogin.addEventListener("click", () => {
    const id = empIdInput.value.trim();
    if (!id) {
      showStatus("社員番号を入力してください", "error");
      return;
    }
    if (STAFF_MASTER[id]) {
      localStorage.setItem("kz_emp_id", id);
      loginAs(id);
    } else {
      showStatus("該当する社員が見つかりません", "error");
    }
  });

  empIdInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") btnLogin.click();
  });

  function loginAs(id) {
    currentUser = STAFF_MASTER[id];
    currentUser.id = id;
    dispName.textContent = currentUser.name;
    dispRole.textContent = currentUser.position;
    avatarText.textContent = currentUser.name.charAt(0).toUpperCase();
    loginView.style.display = "none";
    dashView.style.display = "block";
    resultBox.style.display = "none";
    statusMsg.textContent = "";
  }

  btnLogout.addEventListener("click", () => {
    localStorage.removeItem("kz_emp_id");
    currentUser = null;
    empIdInput.value = "";
    dashView.style.display = "none";
    loginView.style.display = "block";
    statusMsg.textContent = "";
  });

  btnCreate.addEventListener("click", async () => {
    if (!currentUser) return;

    btnCreate.disabled = true;
    btnSpinner.style.display = "inline-block";
    btnText.textContent = "作成中...";
    statusMsg.className = "status-note";
    statusMsg.textContent = "台帳に採番を登録中 (約10秒)...";
    resultBox.style.display = "none";

    try {
      const response = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "createQuotation",
          empId: currentUser.id,
          apiKey: API_SECRET
        })
      });

      const res = await response.json();

      if (res.status === "success") {
        statusMsg.className = "status-note success";
        statusMsg.textContent = "生成完了";
        dispQuoteNo.textContent = res.quoteNo;
        linkOpenSheet.href = res.fileUrl;
        resultBox.style.display = "block";

        window.open(res.fileUrl, "_blank");
      } else {
        throw new Error(res.message || "作成失敗");
      }
    } catch (err) {
      statusMsg.className = "status-note error";
      statusMsg.textContent = err.message;
    } finally {
      btnCreate.disabled = false;
      btnSpinner.style.display = "none";
      btnText.textContent = "＋ 新規見積書を作成";
    }
  });

  function showStatus(text, type) {
    statusMsg.className = "status-note " + type;
    statusMsg.textContent = text;
  }
</script>

</body>
</html>
