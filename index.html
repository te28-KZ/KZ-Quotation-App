<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Projects</title>
  <style>
    :root {
      --bg-sidebar: #F7F7F5;
      --bg-main: #FFFFFF;
      --bg-hover: rgba(55, 53, 47, 0.08);
      --text-main: #37352F;
      --text-muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.09);
      --btn-blue: #2383E2;
      --tag-default: #E3E2E0;
      --tag-blue: #D3E5EF;
      --tag-orange: #FADEC9;
      /* 全体の基本フォント（A案） */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      /* ロゴ用のセリフ体フォント（B案） */
      --font-serif: Lyon-Text, Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
    }
    
    /* サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }
    
    /* ロゴエリア（B案 ＆ スタイル2適用） */
    .workspace-switcher {
      padding: 8px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .workspace-switcher:hover {
      background-color: var(--bg-hover);
    }
    .logo-text {
      font-family: var(--font-serif); /* B案：セリフ体 */
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo-icon-svg {
      width: 36px;   /* 28px から 36px に拡大 */
      height: 36px;  /* 28px から 36px に拡大 */
      flex-shrink: 0;
    }

    /* ナビゲーションメニュー */
    .nav-item {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background-color: var(--bg-hover);
    }
    .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
      font-weight: 500;
    }

   <div class="kanban-board">
        <!-- Draft列 -->
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-draft">0</span> 1. Draft</div>
          <!-- Javascriptがここにカードを挿入します -->
          <div id="col-draft" class="card-list"></div>
        </div>

        <!-- Submitted列 -->
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-submitted">0</span> 2. Submitted</div>
          <div id="col-submitted" class="card-list"></div>
        </div>

        <!-- Negotiating列 -->
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-negotiating">0</span> 3. Negotiating</div>
          <div id="col-negotiating" class="card-list"></div>
        </div>

        <!-- Accepted列 -->
        <div class="column">
          <div class="col-header"><span class="badge" id="badge-accepted">0</span> 4. Accepted</div>
          <div id="col-accepted" class="card-list"></div>
        </div>
      </div>
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <!-- スタイル2: 3Dキューブアイコン ＋ B案: セリフ体フォント -->
    <div class="workspace-switcher">
     <svg class="logo-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 35 L50 20 L80 35 L80 70 L50 85 L20 70 Z" fill="#000000"/>
        <path d="M23 35 L50 22 L77 35 L50 48 Z" fill="#FFFFFF"/>
        <path d="M23 38 L48 50 L48 80 L23 68 Z" fill="#FFFFFF"/>
        <path d="M52 50 L77 38 L77 68 L52 80 Z" fill="#E3E2E0"/>
        <!-- y座標を下げ、フォントサイズを微調整 -->
        <text x="35.5" y="53" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#000000" text-anchor="middle" transform="skewY(25)">B</text>
      </svg>
      <div class="logo-text">Buddy</div>
    </div>

    <div class="nav-item">🏠 Dashboard</div>
    <div class="nav-item active">📂 Projects</div>
    <div class="nav-item">📅 Schedules</div>
  </nav>

  <main class="main-content">
    <p>（ここに前回作成したカンバンボードのHTMLが入ります）</p>
  </main>
<!-- スクリプト -->
  <script>
    // GASのWebアプリURL（※ご自身のURLに差し替えてください）
    const API_URL = 'https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID/exec';
    const API_SECRET = 'YOUR_API_SECRET'; // GAS側で設定したシークレットキー

    // 画面ロード時に直近の案件を取得して表示
    document.addEventListener('DOMContentLoaded', () => {
      fetchLatestProjects();
    });

    async function fetchLatestProjects() {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'searchProjects',
            query: '', // 空欄で検索し、GAS側のslice(0, 5)で直近5件を取得
            apiKey: API_SECRET,
            empId: '10008' // テスト用の社員番号
          })
        });

        const result = await response.json();
        if (result.status === 'success') {
          renderKanbanBoard(result.data);
        } else {
          console.error('API Error:', result.message);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
      }
    }

    function renderKanbanBoard(projects) {
      // 1. 各列のコンテナをクリアする
      const colDraft = document.getElementById('col-draft');
      const colSubmitted = document.getElementById('col-submitted');
      const colNegotiating = document.getElementById('col-negotiating');
      const colAccepted = document.getElementById('col-accepted');
      
      [colDraft, colSubmitted, colNegotiating, colAccepted].forEach(col => col.innerHTML = '');

      // 各列の件数カウンター
      const counts = { draft: 0, submitted: 0, negotiating: 0, accepted: 0 };

      // 2. データをループしてカードを生成・振り分け
      projects.forEach(proj => {
        // 金額のフォーマット（空または0の場合はグレー表示にする等の処理も可能）
        const amountDisplay = (proj.amount && proj.amount !== '0') ? proj.amount : '金額未定';
        
        // カテゴリーやアラートのタグ生成
        let tagsHtml = `<span class="tag tag-draft">${proj.category}</span>`;
        if (proj.orderDeadline) {
           // 期日が設定されていれば警告タグを追加
           const formattedDate = proj.orderDeadline.substring(5); // yyyy-MM-dd -> MM-dd
           tagsHtml += `<span class="tag tag-alert">⚠️ Deadline: ${formattedDate}</span>`;
        }

        // カードのHTML構造
        const cardHtml = `
          <div class="card" onclick="window.open('${proj.fileUrl}', '_blank')">
            <div class="c-id">${proj.quoteNo}</div>
            <div class="c-title">${proj.client} / ${amountDisplay}</div>
            <div class="c-tags">${tagsHtml}</div>
          </div>
        `;

        // 3. ステータスを判定して該当する列に挿入
        const status = proj.status || '';
        
        if (status.includes('1. Draft')) {
          colDraft.insertAdjacentHTML('beforeend', cardHtml);
          counts.draft++;
        } else if (status.includes('2. Submitted')) {
          colSubmitted.insertAdjacentHTML('beforeend', cardHtml);
          counts.submitted++;
        } else if (status.includes('3. Negotiating')) {
          colNegotiating.insertAdjacentHTML('beforeend', cardHtml);
          counts.negotiating++;
        } else if (status.includes('4. Accepted')) {
          colAccepted.insertAdjacentHTML('beforeend', cardHtml);
          counts.accepted++;
        }
      });

      // 4. カラムヘッダーの件数バッジを更新
      document.getElementById('badge-draft').textContent = counts.draft;
      document.getElementById('badge-submitted').textContent = counts.submitted;
      document.getElementById('badge-negotiating').textContent = counts.negotiating;
      document.getElementById('badge-accepted').textContent = counts.accepted;
    }
  </script>
</body>
</html>
