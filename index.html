<!DOCTYPE html>
<html lang="ja">
<head>
  <style>
    /* 共通設定 */
    .workspace-switcher {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }
    
    /* ----------------------------------
       フォントパターンの設定（ここで変更）
    ----------------------------------- */
    .logo-text {
      /* A案: デフォルト */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      
      /* B案: セリフ体にしたい場合はこちらを有効化 */
      /* font-family: Lyon-Text, Georgia, "Yu Mincho", serif; */
      
      /* C案: モノスペース（等幅）にしたい場合はこちらを有効化 */
      /* font-family: "SFMono-Regular", Menlo, Consolas, monospace; */
      
      font-size: 18px;
      font-weight: 600;
      color: #37352F;
      letter-spacing: -0.02em;
    }

    /* ----------------------------------
       スタイル1：ダーク角丸アイコン (画像1枚目風)
    ----------------------------------- */
    .icon-style-1 {
      width: 28px;
      height: 28px;
      background-color: #37352F; /* Notionのダークグレー */
      color: #FFFFFF;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      font-family: -apple-system, sans-serif;
      box-shadow: rgba(15, 15, 15, 0.1) 0px 1px 2px;
    }

    /* ----------------------------------
       スタイル2：3Dキューブアイコン (画像2枚目風SVG)
    ----------------------------------- */
    .icon-style-2 {
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body style="background-color: #F7F7F5; padding: 20px;">

  <!-- パターン1：角丸アイコン ＋ Buddy -->
  <div class="workspace-switcher">
    <div class="icon-style-1">B</div>
    <div class="logo-text">Buddy</div>
  </div>

  <br><br>

  <!-- パターン2：3Dキューブ ＋ Buddy -->
  <div class="workspace-switcher">
    <svg class="icon-style-2" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- キューブの黒い外枠・影 -->
      <path d="M20 35 L50 20 L80 35 L80 70 L50 85 L20 70 Z" fill="#000000"/>
      <!-- 天面（白） -->
      <path d="M23 35 L50 22 L77 35 L50 48 Z" fill="#FFFFFF"/>
      <!-- 左側面（白） -->
      <path d="M23 38 L48 50 L48 80 L23 68 Z" fill="#FFFFFF"/>
      <!-- 右側面（少しグレー） -->
      <path d="M52 50 L77 38 L77 68 L52 80 Z" fill="#E3E2E0"/>
      <!-- 左側面の「B」 -->
      <text x="35" y="70" font-family="serif" font-size="28" font-weight="900" fill="#000000" transform="skewY(25)">B</text>
    </svg>
    <div class="logo-text">Buddy</div>
  </div>

</body>
</html>
