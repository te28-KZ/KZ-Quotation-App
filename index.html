  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Workspace</title>
  <style>
    :root {
      --bg-sidebar: #F7F7F5;
      --bg-main: #FFFFFF;
      --bg-hover: rgba(55, 53, 47, 0.08);
      --text-main: #37352F;
      --text-muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.09);
      --btn-blue: #2383E2;
      --btn-blue-hover: #1A73CC;
      --tag-default: #E3E2E0;
      --tag-blue: #D3E5EF;
      --tag-orange: #FADEC9;
      --tag-red: #FFE2DD;
      --tag-green: #DBEDDB;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-serif: Lyon-Text, Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
    }
    
    /* サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      flex-shrink: 0;
      justify-content: space-between;
    }
    .workspace-switcher {
      padding: 8px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .workspace-switcher:hover {
      background-color: var(--bg-hover);
    }
    .logo-text {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo-icon-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .nav-item {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background-color: var(--bg-hover);
    }
    .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
      font-weight: 500;
    }

    /* ユーザーフッター */
    .user-profile {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-info {
      display: flex;
      flex-direction: column;
    }
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .user-role {
      font-size: 11px;
      color: var(--text-muted);
    }
    .btn-logout {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px;
    }
    .btn-logout:hover {
      color: #EB5757;
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .view-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .view-panel.active {
      display: flex;
    }

    .top-header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .page-title {
      font-size: 16px;
      font-weight: 600;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      width: 280px;
    }
    .search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      width: 100%;
      color: var(--text-main);
    }
    .filter-select {
      border: 1px solid var(--border);
      background: #FFF;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }
    .btn-primary {
      background-color: var(--btn-blue);
      color: #FFF;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: var(--btn-blue-hover);
    }

    /* Dashboard */
    .dashboard-container {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 1100px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .metric-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      background: #FFF;
      box-shadow: rgba(15, 15, 15, 0.03) 0px 1px 3px;
    }
    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .metric-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }
    .dashboard-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dash-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #FFF;
    }
    .dash-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .dash-row:last-child {
      border-bottom: none;
    }
    .dash-row:hover {
      background-color: var(--bg-sidebar);
    }
    .dash-col-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dash-item-title {
      font-size: 14px;
      font-weight: 600;
    }
    .dash-item-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .dash-col-side {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }

    /* Projects カンバン */
    .board-container {
      padding: 24px 32px;
      flex: 1;
      overflow-x: auto;
    }
    .kanban-board {
      display: flex;
      gap: 16px;
      min-width: 900px;
      height: 100%;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .badge {
      background: var(--tag-default);
      padding: 0 6px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
    }
    .card {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      box-shadow: rgba(15, 15, 15, 0.05) 0px 1px 2px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .card:hover {
      background-color: var(--bg-sidebar);
    }
    .c-id {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .c-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .c-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text-main);
    }
    .tag-draft { background-color: var(--tag-default); }
    .tag-sub { background-color: var(--tag-blue); }
    .tag-alert { background-color: var(--tag-orange); }
    .tag-danger { background-color: var(--tag-red); color: #EB5757; }
    .tag-followup { background-color: #FDECC8; color: #9F6B00; font-weight: 600; }

    .tag-snooze { background-color: #E3E2E0; color: #5A5A5A; }

    /* 提出後フォロー通知ポップアップ */
    .followup-list { text-align: left; max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin: 0 0 16px 0; }
    .followup-item { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
    .followup-item:last-child { border-bottom: none; }
    .followup-item:hover { background-color: var(--bg-sidebar); }
    .followup-item-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .followup-notify-btn { background: none; border: none; color: #2383E2; font-size: 12px; cursor: pointer; padding: 0; margin-bottom: 12px; }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 15, 15, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #FFFFFF;
      width: 520px;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: rgba(15, 15, 15, 0.1) 0px 0px 0px 1px, rgba(15, 15, 15, 0.2) 0px 5px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--btn-blue);
      box-shadow: rgba(35, 131, 226, 0.2) 0px 0px 0px 2px;
    }
    .form-readonly {
      background-color: var(--bg-sidebar);
      cursor: not-allowed;
      color: var(--text-muted);
    }
    .modal-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #FAFAFA;
    }
    .modal-footer-right {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline-primary {
      background: #FFFFFF;
      border: 1px solid var(--btn-blue);
      color: var(--btn-blue);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-outline-primary:hover {
      background: var(--tag-blue);
    }
    .open-file-link {
      font-size: 13px;
      color: var(--btn-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .open-file-link:hover {
      text-decoration: underline;
    }
    .memo-history {
      background-color: var(--bg-sidebar);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.4;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .read-only-banner {
      background-color: var(--tag-red);
      color: #EB5757;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      display: none;
    }

    /* ログイン画面 */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: rgba(15, 15, 15, 0.05) 0px 4px 16px;
      text-align: center;
    }
    .login-box .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ローディングスピナー */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 物件管理 */
    .pj-tabs { display: flex; gap: 4px; padding: 12px 32px 0 32px; }
    .pj-tab { padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; color: var(--text-muted); }
    .pj-tab.active { background: var(--bg-hover); color: var(--text-main); font-weight: 600; }
    .pj-table-wrap { padding: 12px 32px 32px 32px; overflow: auto; flex: 1; }
    .pj-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pj-table th { text-align: left; font-weight: 500; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: #FFF; }
    .pj-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .pj-table tbody tr.clickable { cursor: pointer; }
    .pj-table tbody tr.clickable:hover { background: var(--bg-sidebar); }
    .pj-table .num { text-align: right; white-space: nowrap; }
    .pj-table .tag, .pj-table .stage-tag { white-space: nowrap; display: inline-block; }
    .pj-table .pj-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .pj-table tr.pj-branch td:first-child { padding-left: 22px; }
    .pj-table tr.pj-branch td:first-child::before { content: '└ '; color: var(--text-muted); }
    .pj-add-branch { display: flex; justify-content: flex-end; margin-top: 8px; }
    .pj-empty { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .stage-tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 12px; white-space: nowrap; }
    .stage-1 { background: #E3E2E0; color: #32302C; }
    .stage-2 { background: #D3E5EF; color: #183347; }
    .stage-3 { background: #DBEDDB; color: #1C3829; }
    .stage-4 { background: #FDECC8; color: #402C1B; }
    .stage-5 { background: #E8DEEE; color: #412454; }
    .stage-6 { background: #EEE0DA; color: #442A1E; }
    .stage-9 { background: #FFE2DD; color: #5D1715; }
    .pj-quotes { border: 1px solid var(--border); border-radius: 6px; }
    .pj-quote-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
    .pj-quote-row:last-child { border-bottom: none; }
    .pj-quote-row:hover { background: var(--bg-sidebar); }
    .pj-add-quote { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .pj-add-quote select { flex: 1; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-2 > .form-group { min-width: 0; }
    .form-row-2 .form-input, .form-row-2 .form-select { width: 100%; box-sizing: border-box; min-width: 0; }
    .form-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-main); }

    /* 言語切り替え */
    .lang-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .lang-select {
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #FFF;
      color: var(--text-main);
      cursor: pointer;
    }
    .login-box .lang-select { align-self: center; }
  </style>
  <!-- Googleログイン -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="logo-area">
        <svg class="logo-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 35 L50 20 L80 35 L80 70 L50 85 L20 70 Z" fill="#000000"/>
          <path d="M23 35 L50 22 L77 35 L50 48 Z" fill="#FFFFFF"/>
          <path d="M23 38 L48 50 L48 80 L23 68 Z" fill="#FFFFFF"/>
          <path d="M52 50 L77 38 L77 68 L52 80 Z" fill="#E3E2E0"/>
          <text x="35.5" y="53" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#000000" text-anchor="middle" transform="skewY(25)">B</text>
        </svg>
        <div class="logo-text" style="font-size: 22px;">Buddy</div>
      </div>
      <div style="font-size: 13px; color: var(--text-muted);" data-i18n="login.prompt"></div>
      <div id="googleBtn" style="display: flex; justify-content: center; min-height: 44px;"></div>
      <div id="loginStatus" style="font-size: 12px; color: var(--text-muted); display: none;"></div>
      <div id="loginError" style="color: #EB5757; font-size: 12px; display: none; line-height: 1.5;"></div>
      <select class="lang-select" onchange="setLang(this.value)" aria-label="Language">

    const LANGS = ['ja', 'vi', 'en'];
    let currentLang = detectInitialLang();

    function detectInitialLang() {
      const saved = localStorage.getItem('buddy_lang');
      if (LANGS.includes(saved)) return saved;
      const nav = (navigator.language || '').toLowerCase();
      if (nav.startsWith('ja')) return 'ja';
      if (nav.startsWith('vi')) return 'vi';
      return 'en';
    }

    // 翻訳: t('key', {var: value})
    function t(key, vars) {
      let s = (I18N[currentLang] && I18N[currentLang][key]) ?? I18N.en[key] ?? key;
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    }

    // ステータス表示（台帳に保存する値は変えず、表示だけ翻訳）
    function statusLabel(status) {
      const s = String(status || '');
      const key = Object.keys(I18N.en).find(k => k.startsWith('status.') && s.startsWith(k.slice(7, 9)));
      return key ? t(key) : s;
    }

    function categoryLabel(cat) {
      const c = String(cat || '');
      if (c.includes('親会社') || /japan hq/i.test(c)) return t('cat.hq');
      if (c.includes('国内') || /domestic/i.test(c)) return t('cat.domestic');
      if (c.includes('輸出') || /overseas/i.test(c)) return t('cat.overseas');
      return c || t('common.unset');
    }

    function applyI18n() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      document.querySelectorAll('[data-status]').forEach(el => { el.textContent = statusLabel(el.dataset.status); });
      document.querySelectorAll('.lang-select').forEach(el => { el.value = currentLang; });
      document.getElementById('followupTitle').textContent = t('followup.title', { days: followUpDays });
      document.getElementById('loadingText').textContent = t('loading.default');
    }

    // 言語切り替え（ブラウザに記憶 + ログイン中ならStaffシートにも保存＝メールの言語にも反映）
    function setLang(lang) {
      if (!LANGS.includes(lang)) return;
      currentLang = lang;
      localStorage.setItem('buddy_lang', lang);
      applyI18n();
      renderGoogleButton();
      if (currentUser) {
        buildSalesFilter();
        buildStageOptions();
        renderDashboard(rawProjects);
        renderFollowUps();
        onFilterChange();
        renderProjectsView();
        api('setLanguage', { lang: lang }).catch(() => {});
      }
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* =========================================================
     * API 呼び出し（セッショントークンを付与。期限切れならログイン画面へ）
     * ========================================================= */
    async function api(action, params) {
      const body = { action: action, token: localStorage.getItem('buddy_session') || '', ...(params || {}) };
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body)
      });
      const res = await response.json();
      if (res.status !== 'success' && res.code === 'AUTH') {
        handleSessionExpired();
        throw new Error('AUTH');
      }
      return res;
    }

    /* =========================================================
     * 認証（Googleアカウント）
     * ========================================================= */
    async function initAuth() {
      // 保存済みセッションがあれば確認
      if (localStorage.getItem('buddy_session')) {
        try {
          const res = await api('whoami');
          if (res.status === 'success' && res.user) { onLoggedIn(res.user, res.staffNames); return; }
        } catch (e) { /* 期限切れ → ログイン画面 */ }
      }
      showLoginScreen();
    }

    async function showLoginScreen(messageKey) {
      document.getElementById('loginOverlay').style.display = 'flex';
      const errEl = document.getElementById('loginError');
      errEl.style.display = messageKey ? 'block' : 'none';
      if (messageKey) errEl.textContent = t(messageKey);

      if (!googleClientId) {
        try {
          const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'getConfig' }) });
          googleClientId = (await res.json()).clientId || '';
        } catch (e) { /* 通信エラー */ }
      }
      if (!googleClientId) {
        errEl.style.display = 'block';
        errEl.textContent = t('login.config');
        return;
      }
      waitForGoogle(() => {
        google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential, auto_select: true });
        renderGoogleButton();
      });
    }

    function waitForGoogle(cb, tries) {
      if (window.google && google.accounts && google.accounts.id) return cb();
      if ((tries || 0) > 100) return;
      setTimeout(() => waitForGoogle(cb, (tries || 0) + 1), 100);
    }

    function renderGoogleButton() {
      const box = document.getElementById('googleBtn');
      if (!box || !googleClientId || !window.google || !google.accounts || currentUser) return;
      box.innerHTML = '';
      google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with', locale: currentLang, width: 260 });
    }

    async function onGoogleCredential(resp) {
      const statusEl = document.getElementById('loginStatus');
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      statusEl.style.display = 'block';
      statusEl.textContent = t('login.checking');
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'login', idToken: resp.credential })
        });
        const res = await response.json();
        statusEl.style.display = 'none';
        if (res.status === 'success') {
          localStorage.setItem('buddy_session', res.token);
          onLoggedIn(res.user, res.staffNames);
        } else {
          errEl.style.display = 'block';
          errEl.textContent = t(res.code === 'NOT_STAFF' ? 'login.notStaff' : res.code === 'CONFIG' ? 'login.config' : 'login.failed');
          if (res.code === 'NOT_STAFF') google.accounts.id.disableAutoSelect();
        }
      } catch (e) {
        statusEl.style.display = 'none';
        errEl.style.display = 'block';
        errEl.textContent = t('err.network');
      }
    }

    function onLoggedIn(user, names) {
      currentUser = user;
      staffNames = names || [];
      // この端末で言語を選んだことがなければ、Staffシートの言語設定を使う
      if (!localStorage.getItem('buddy_lang') && LANGS.includes(user.lang)) {
        currentLang = user.lang;
        applyI18n();
      }
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('currentUserName').textContent = user.name;
      document.getElementById('currentUserRole').textContent = user.position;
      buildSalesFilter();
      buildStageOptions();
      fetchLatestProjects();
      fetchProjects();
      if (!followUpTimer) followUpTimer = setInterval(fetchFollowUps, FOLLOWUP_CHECK_INTERVAL);
    }

    function handleSessionExpired() {
      if (!currentUser) return;
      localStorage.removeItem('buddy_session');
      location.reload();
    }

    async function executeLogout() {
      if (!confirm(t('user.signoutConfirm'))) return;
      try { await api('logout'); } catch (e) { /* 既に無効でもOK */ }
      localStorage.removeItem('buddy_session');
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
      location.reload();
    }

    function buildSalesFilter() {
      const sel = document.getElementById('salesFilter');
      const prev = sel.value || 'ALL';
      sel.innerHTML = `<option value="ALL">${esc(t('filter.all'))}</option>`
        + staffNames.map(n => `<option value="${esc(n)}">${esc(t('filter.only', { name: n }))}</option>`).join('');
      sel.value = [...sel.options].some(o => o.value === prev) ? prev : 'ALL';

      const pjSel = document.getElementById('pjSalesFilter');
      const pjPrev = pjSel.value || 'ALL';
      pjSel.innerHTML = `<option value="ALL">${esc(t('pj.allSales'))}</option>`
        + staffNames.map(n => `<option value="${esc(n)}">${esc(t('filter.only', { name: n }))}</option>`).join('');
      pjSel.value = [...pjSel.options].some(o => o.value === pjPrev) ? pjPrev : 'ALL';
    }

    /* =========================================================
     * 画面切り替え・検索
     * ========================================================= */
    function switchView(viewName) {
      ['dashboard', 'properties', 'projects'].forEach(v => {
        document.getElementById('nav-' + v).classList.toggle('active', viewName === v);
        document.getElementById('view-' + v).classList.toggle('active', viewName === v);
      });
    }

    // Dashboardからの検索処理（自動でProjectsに切り替えて絞り込み）
    function handleDashSearch(query) {
      switchView('projects');
      const projectSearchInput = document.getElementById('searchInput');
      projectSearchInput.value = query;
      projectSearchInput.focus();
      onFilterChange();
    }

    /* =========================================================
     * 案件取得・ダッシュボード
     * ========================================================= */
    async function fetchLatestProjects() {
      try {
        const result = await api('searchProjects', { query: '' });
        if (result.status === 'success') {
          rawProjects = result.data;
          renderDashboard(rawProjects);
          onFilterChange();
          fetchFollowUps();
        } else {
          console.error('API Error:', result.message);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
      }
    }

    function emptyRow(text) {
      return `<div style="padding: 16px; font-size: 13px; color: var(--text-muted); text-align: center;">${esc(text)}</div>`;
    }

    function renderDashboard(projects) {
      const counts = { draft: 0, submitted: 0, negotiating: 0, accepted: 0 };
      projects.forEach(p => {
        const s = p.status || '';
        if (s.includes('1. Draft')) counts.draft++;
        else if (s.includes('2. Submitted')) counts.submitted++;
        else if (s.includes('3. Negotiating')) counts.negotiating++;
        else if (s.includes('4. Accepted')) counts.accepted++;
      });

      document.getElementById('kpi-draft').textContent = counts.draft;
      document.getElementById('kpi-submitted').textContent = counts.submitted;
      document.getElementById('kpi-negotiating').textContent = counts.negotiating;
      document.getElementById('kpi-accepted').textContent = counts.accepted;

      const deadlineContainer = document.getElementById('dash-deadline-list');
      deadlineContainer.innerHTML = '';

      const pendingWithDeadlines = projects
        .filter(p => p.orderDeadline && !p.status.includes('4. Accepted') && !p.status.includes('9. Lost'))
        .sort((a, b) => new Date(a.orderDeadline) - new Date(b.orderDeadline));

      if (pendingWithDeadlines.length === 0) {
        deadlineContainer.innerHTML = emptyRow(t('deadline.none'));
        return;
      }
      pendingWithDeadlines.slice(0, 5).forEach(p => {
        const row = document.createElement('div');
        row.className = 'dash-row';
        row.onclick = () => openEditModal(p.quoteNo);
        row.innerHTML = `
          <div class="dash-col-main">
            <span class="dash-item-title">${esc(p.quoteNo)} - ${esc(p.client || t('common.notEntered'))}</span>
            <span class="dash-item-sub">${esc(p.details || t('common.noDetails'))} / ${esc(t('row.delivery'))}: ${esc(p.deliveryDate || t('common.tbd'))}</span>
          </div>
          <div class="dash-col-side">
            <span class="tag tag-danger">${esc(t('row.orderDeadline'))}: ${esc(p.orderDeadline)}</span>
            <span class="tag tag-draft">${esc(statusLabel(p.status))}</span>
          </div>
        `;
        deadlineContainer.appendChild(row);
      });
    }

    /* =========================================================
     * 提出後フォロー通知
     * ========================================================= */
    async function fetchFollowUps() {
      if (!currentUser) return;
      try {
        const result = await api('getFollowUps');
        if (result.status !== 'success') { console.error('FollowUp API Error:', result.message); return; }
        followUpProjects = result.data || [];
        if (result.days) followUpDays = result.days;
        document.getElementById('followupTitle').textContent = t('followup.title', { days: followUpDays });
        renderFollowUps();
        onFilterChange(); // カンバンにもタグを反映

        const mine = followUpProjects.filter(p => isProjectOwner(p));
        if (!followUpPopupShown) {
          // ログイン直後：画面中央のポップアップ（既に通知済みとして記録）
          followUpPopupShown = true;
          mine.forEach(p => notifiedFollowUps.add(followUpKey(p)));
          if (mine.length > 0) {
            showFollowupModal(mine);
            if (document.hidden) sendDesktopNotify(mine);
          }
        } else {
          // 定期チェック：新しく該当した自分の案件だけをデスクトップ通知
          const fresh = mine.filter(p => !notifiedFollowUps.has(followUpKey(p)));
          fresh.forEach(p => notifiedFollowUps.add(followUpKey(p)));
          if (fresh.length > 0) sendDesktopNotify(fresh);
        }
      } catch (error) {
        console.error('FollowUp Fetch Error:', error);
      }
    }

    function todayStr() {
      // ベトナム時間の今日（GAS側の判定と合わせる）
      return new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10);
    }

    function followUpKey(p) { return p.quoteNo + '|' + p.reason; }

      return p.reason === 'due'
        ? t('fu.due', { date: (p.nextFollowUp || '').substring(5) })

    function renderFollowUps() {

      container.innerHTML = '';

        container.innerHTML = emptyRow(t('followup.none'));

      // 自分の案件を先に表示
      const sorted = [...followUpProjects].sort((a, b) => (isProjectOwner(b) - isProjectOwner(a)) || (b.daysSinceAction - a.daysSinceAction));

    // デスクトップ通知（ブラウザの許可が必要。アプリを開いている間のみ）
    async function enableDesktopNotify() {
      if (!('Notification' in window)) { alert(t('fu.notifyUnsupported')); return; }
      const perm = await Notification.requestPermission();
      document.getElementById('enableDesktopNotifyBtn').style.display = 'none';
      if (perm === 'granted') new Notification('Buddy', { body: t('fu.notifyEnabled') });
    }

    function sendDesktopNotify(items) {
      if (!('Notification' in window) || Notification.permission !== 'granted' || items.length === 0) return;
      const body = items.slice(0, 3).map(p => `${p.quoteNo}（${p.client || t('common.notEntered')}）${followUpLabel(p)}`).join('\n')
        + (items.length > 3 ? '\n' + t('fu.more', { n: items.length - 3 }) : '');
      const n = new Notification(t('fu.notifyTitle', { n: items.length }), { body: body, tag: 'buddy-followup' });
      n.onclick = () => { window.focus(); openFollowupDashboard(); n.close(); };
    }

    /* =========================================================
     * Projects（カンバン）
     * ========================================================= */
    function onFilterChange() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const salesFilter = document.getElementById('salesFilter').value || 'ALL';

      const filtered = rawProjects.filter(p => {
        if (salesFilter !== 'ALL' && !salesMatches(p.salesPerson, salesFilter)) return false;
        if (q) {
          const matchNo = (p.quoteNo || '').toLowerCase().includes(q);
          const matchClient = (p.client || '').toLowerCase().includes(q);
          const matchDetails = (p.details || '').toLowerCase().includes(q);
          return matchNo || matchClient || matchDetails;
        }
        return true;
      });

      renderKanbanBoard(filtered);
    }

    // 台帳の担当者名（例: 'Thịnh'）と社員名（例: 'Nguyễn Tiến Thịnh'）の照合
    function salesMatches(salesPerson, staffName) {
      const sales = String(salesPerson || '').toLowerCase();
      const name = String(staffName || '').toLowerCase();
      if (!sales || !name) return false;
      return sales.includes(name) || name.split(' ').some(part => part.length > 2 && sales.includes(part));
    }

    function renderKanbanBoard(projects) {
      const cols = {
        draft: document.getElementById('col-draft'),
        submitted: document.getElementById('col-submitted'),
        negotiating: document.getElementById('col-negotiating'),
        accepted: document.getElementById('col-accepted')
      };
      Object.values(cols).forEach(col => col.innerHTML = '');
      const counts = { draft: 0, submitted: 0, negotiating: 0, accepted: 0 };

      projects.forEach(proj => {
        const amountDisplay = (proj.amount && proj.amount !== '0') ? proj.amount : t('card.amountTbd');

        let tagsHtml = `<span class="tag tag-draft">${esc(categoryLabel(proj.category))}</span>`;
        if (proj.salesPerson) {
          tagsHtml += `<span class="tag tag-sub">${esc(proj.salesPerson.split(' ')[0])}</span>`;
        }
        if (proj.orderDeadline) {
          tagsHtml += `<span class="tag tag-alert">${esc(t('card.deadline'))}: ${esc(proj.orderDeadline.substring(5))}</span>`;
        }
        const fu = followUpProjects.find(f => f.quoteNo === proj.quoteNo);
        if (fu) {
          tagsHtml += `<span class="tag tag-followup">${esc(followUpLabel(fu))}</span>`;
        } else if ((proj.status || '').startsWith('2.') && proj.nextFollowUp && proj.nextFollowUp > todayStr()) {
          tagsHtml += `<span class="tag tag-snooze">${esc(t('fu.snooze', { date: proj.nextFollowUp.substring(5) }))}</span>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openEditModal(proj.quoteNo);
        card.innerHTML = `
          <div class="c-id">${esc(proj.quoteNo)}</div>
          <div class="c-title">${esc(proj.client)} / ${esc(amountDisplay)}</div>
          <div class="c-tags">${tagsHtml}</div>
        `;

        const status = proj.status || '';
        const key = status.includes('1. Draft') ? 'draft'
          : status.includes('2. Submitted') ? 'submitted'
          : status.includes('3. Negotiating') ? 'negotiating'
          : status.includes('4. Accepted') ? 'accepted' : null;
        if (key) { cols[key].appendChild(card); counts[key]++; }
      });

      Object.keys(counts).forEach(k => { document.getElementById('badge-' + k).textContent = counts[k]; });
    }

    /* =========================================================
     * 編集モーダル
     * ========================================================= */
    function isProjectOwner(proj) {
      if (!proj || !currentUser) return false;
      return !!currentUser.isAdmin || salesMatches(proj.salesPerson, currentUser.name);
    }

    function openEditModal(quoteNo) {
      // 直近10件に含まれない古い案件（フォロー通知から開いた場合）も開けるようにする
      const proj = rawProjects.find(p => p.quoteNo === quoteNo) || followUpProjects.find(p => p.quoteNo === quoteNo)
        || projectsData.flatMap(pj => pj.quotes || []).find(q => q.quoteNo === quoteNo);
      if (!proj) return;

      selectedQuoteNo = quoteNo;
      document.getElementById('editModalTitle').textContent = t('edit.title', { no: proj.quoteNo, sales: proj.salesPerson || t('common.unset') });
      document.getElementById('editFileUrl').href = proj.fileUrl || '#';
      document.getElementById('editClient').value = proj.client || '';
      document.getElementById('editAmount').value = proj.amount || '0';
      document.getElementById('editStatus').value = proj.status || '1. Draft';
      document.getElementById('editDeliveryDate').value = proj.deliveryDate || '';
      document.getElementById('editNextFollowUp').value = proj.nextFollowUp || '';
      toggleNextFollowUp();
      document.getElementById('editTradeType').value = proj.tradeType || '直接取引(Direct)';
      document.getElementById('editDetails').value = proj.details || '';
      document.getElementById('editNewMemo').value = '';
      document.getElementById('editMemoHistory').textContent = proj.memo || t('f.noHistory');

      const isOwner = isProjectOwner(proj);
      const inputs = ['editStatus', 'editDeliveryDate', 'editNextFollowUp', 'editTradeType', 'editDetails', 'editNewMemo']
        .map(id => document.getElementById(id));

      document.getElementById('readOnlyBanner').style.display = isOwner ? 'none' : 'block';
      document.getElementById('saveEditBtn').style.display = isOwner ? 'block' : 'none';
      document.getElementById('createRevisionBtn').style.display = isOwner ? 'block' : 'none';
      document.getElementById('memoGroup').style.display = isOwner ? 'flex' : 'none';
      inputs.forEach(el => el.disabled = !isOwner);

      document.getElementById('editModalOverlay').classList.add('active');
    }

    // 次回フォロー日は「2. Submitted」のときだけ表示
    function toggleNextFollowUp() {
      const isSubmitted = document.getElementById('editStatus').value.startsWith('2.');
      document.getElementById('nextFollowUpGroup').style.display = isSubmitted ? 'flex' : 'none';
    }

    function closeEditModal() {
      document.getElementById('editModalOverlay').classList.remove('active');
      selectedQuoteNo = null;
    }

    async function saveProjectUpdate() {
      if (!selectedQuoteNo) return;
      const saveBtn = document.getElementById('saveEditBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = t('btn.saving');

      const status = document.getElementById('editStatus').value;
      const payload = {
        quoteNo: selectedQuoteNo,
        status: status,
        deliveryDate: document.getElementById('editDeliveryDate').value,
        // 提出済以外に変えた場合はフォロー日をクリア
        nextFollowUp: status.startsWith('2.') ? document.getElementById('editNextFollowUp').value : '',
        tradeType: document.getElementById('editTradeType').value,
        details: document.getElementById('editDetails').value,
        memo: document.getElementById('editNewMemo').value
      };

      try {
        const res = await api('updateProject', payload);
        if (res.status === 'success') {
          closeEditModal();
          await fetchLatestProjects();
          fetchProjects();
        } else {
          alert(t('err.update') + res.message);
        }
      } catch (err) {
        if (err.message !== 'AUTH') alert(t('err.network'));
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = t('btn.save');
      }
    }

    async function submitCreateRevision() {
      if (!selectedQuoteNo) return;
      if (!confirm(t('confirm.revision', { no: selectedQuoteNo }))) return;

      const baseNo = selectedQuoteNo;
      closeEditModal();
      showLoading('loading.revision');

      try {
        const res = await api('createRevision', { quoteNo: baseNo });
        if (res.status === 'success') {
          await fetchLatestProjects();
          fetchProjects();
          showConfirmModal('confirm.revCreated', t('confirm.desc', { no: esc(res.quoteNo) }), res.fileUrl);
        } else {
          alert(t('err.revision') + res.message);
        }
      } catch (err) {
        if (err.message !== 'AUTH') alert(t('err.network'));
      } finally {
        hideLoading();
      }
    }

    /* =========================================================
     * 物件（一覧・客先別集計・詳細・新規作成）
     * ========================================================= */
    async function fetchProjects() {
      try {
        const res = await api('getProjects');
        if (res.status !== 'success') { console.error('Projects API Error:', res.message); return; }
        projectsData = res.projects || [];
        clientsList = res.clients || [];
        clientContacts = res.clientContacts || {};
        if (res.jpClient) jpClient = res.jpClient;
        jpAliases = res.jpAliases || [];
        if (res.stages) projectStages = res.stages;
        document.getElementById('clientList').innerHTML = clientsList.map(c => `<option value="${esc(c)}"></option>`).join('');
        buildStageOptions();
        renderProjectsView();
        if (selectedProjectNo) openProjectModal(selectedProjectNo, true);
      } catch (e) {
        console.error('Projects Fetch Error:', e);
      }
    }

    function stageLabel(stage) {
      const n = parseInt(stage, 10);
      const key = Object.keys(I18N.en).find(k => k.startsWith('stage.') && parseInt(k.slice(6), 10) === n);
      return key ? t(key) : (stage || '');
    }

    function stageTag(stage) {
      const n = parseInt(stage, 10) || 1;
      return `<span class="stage-tag stage-${n}">${esc(stageLabel(stage))}</span>`;
    }

    function catKey(category) {
      const c = String(category || '');
      if (c.includes('親会社') || /japan hq/i.test(c)) return 'hq';
      if (c.includes('輸出') || /overseas/i.test(c)) return 'overseas';
      return 'domestic';
    }

    function buildStageOptions() {
      const filter = document.getElementById('pjStageFilter');
      const prev = filter.value || 'ACTIVE';
      filter.innerHTML = `<option value="ACTIVE">${esc(t('pj.activeStages'))}</option><option value="ALL">${esc(t('pj.allStages'))}</option>`
        + projectStages.map(st => `<option value="${esc(st)}">${esc(stageLabel(st))}</option>`).join('');
      filter.value = [...filter.options].some(o => o.value === prev) ? prev : 'ACTIVE';
      const sel = document.getElementById('pjStage');
      const cur = sel.value;
      sel.innerHTML = projectStages.map(st => `<option value="${esc(st)}">${esc(stageLabel(st))}</option>`).join('');
      if (cur) sel.value = cur;
    }

    function setProjectsTab(tab) {
      pjTab = tab;
      document.getElementById('pjTabList').classList.toggle('active', tab === 'list');
      document.getElementById('pjTabClients').classList.toggle('active', tab === 'clients');
      renderProjectsView();
    }

    function filteredProjects(ignoreStage) {
      const q = document.getElementById('pjSearch').value.toLowerCase().trim();
      const cat = document.getElementById('pjCategoryFilter').value;
      const stage = document.getElementById('pjStageFilter').value;
      const sales = document.getElementById('pjSalesFilter').value || 'ALL';
      return projectsData.filter(p => {
        if (cat !== 'ALL' && catKey(p.category) !== cat) return false;
        if (sales !== 'ALL' && !salesMatches(p.salesPerson, sales)) return false;
        if (!ignoreStage) {
          const n = parseInt(p.stage, 10);
          if (stage === 'ACTIVE' && (n >= 6)) return false;
          if (stage !== 'ACTIVE' && stage !== 'ALL' && p.stage !== stage) return false;
        }
        if (q) {
          const hay = [p.projectNo, p.name, p.client, p.contact, ...(p.quotes || []).map(x => x.quoteNo)].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderProjectsView() {
      const box = document.getElementById('pjContent');
      if (!box) return;
      // 客先別集計では段階の絞り込みを使わない（受注率を正しく出すため）
      document.getElementById('pjStageFilter').style.display = pjTab === 'clients' ? 'none' : '';
      if (pjTab === 'clients') { box.innerHTML = renderClientSummary(filteredProjects(true)); return; }

      const list = groupBranches(filteredProjects(false));
      if (list.length === 0) { box.innerHTML = `<div class="pj-empty">${esc(t('pj.none'))}</div>`; return; }
      const rows = list.map(p => `
        <tr class="clickable${isBranch(p.projectNo) ? ' pj-branch' : ''}" onclick="openProjectModal('${esc(p.projectNo)}')">
          <td style="white-space: nowrap;">${esc(p.projectNo)}</td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.client || '-')}${p.contact ? `<div class="pj-sub">${esc(p.contact)}</div>` : ''}</td>
          <td><span class="tag tag-draft">${esc(categoryLabel(p.category))}</span></td>
          <td>${stageTag(p.stage)}</td>
          <td>${esc((p.salesPerson || '').split(' ')[0])}</td>
          <td class="num">${esc(p.orderAmount || '-')}</td>
          <td style="white-space: nowrap;">${esc(p.deliveryDate || '-')}</td>
          <td class="num">${(p.quotes || []).length}</td>
        </tr>`).join('');
      box.innerHTML = `<table class="pj-table"><thead><tr>
          <th>${esc(t('pj.colNo'))}</th><th>${esc(t('pj.colName'))}</th><th>${esc(t('pj.colClient'))}</th>
          <th>${esc(t('pj.colCategory'))}</th><th>${esc(t('pj.colStage'))}</th><th>${esc(t('pj.colOwner'))}</th>
          <th class="num">${esc(t('pj.colAmount'))}</th><th>${esc(t('pj.colDelivery'))}</th><th class="num">${esc(t('pj.colQuotes'))}</th>
        </tr></thead><tbody>${rows}</tbody></table>`;
    }

    // 物件No（10桁）= 元の番号 + 枝番2桁。枝番02以降は元の物件のすぐ下にまとめて表示
    function projectBase(no) { return String(no || '').slice(0, -2); }
    function isBranch(no) { return /^(?:JP)?\d{10}$/.test(no) && String(no).slice(-2) !== '01'; }
    function groupBranches(list) {
      const order = [], groups = {};
      list.forEach(p => {
        const b = projectBase(p.projectNo);
        if (!groups[b]) { groups[b] = []; order.push(b); }
        groups[b].push(p);
      });
      return order.flatMap(b => groups[b].sort((x, y) => x.projectNo.localeCompare(y.projectNo)));
    }

    // 客先担当者の候補（選んだ客先で過去に入力した名前）
    function updateContactList(client) {
      const names = clientContacts[String(client || '').trim()] || [];
      document.getElementById('contactList').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');
    }

    // 入力された客先が KATZ JP（または別名）か
    function isJpClientName(name) {
      const k = s => String(s || '').toLowerCase().replace(/[\s.,，。・\-_()（）]/g, '');
      const v = k(name);
      return !!v && [jpClient, ...jpAliases].some(a => k(a) === v);
    }

    // 金額文字列 → { cur, val }（$ / ₫ / ¥ を判定。通貨ごとに合計するため）
    function parseAmount(str) {
      const s = String(str || '').trim();
      if (!s || s === '0' || s === '-') return null;
      let cur = 'OTHER';
      if (s.includes('$') || /usd/i.test(s)) cur = 'USD';
      else if (s.includes('₫') || /vnd|đ/i.test(s)) cur = 'VND';
      else if (s.includes('¥') || s.includes('円') || /jpy/i.test(s)) cur = 'JPY';
      let num;
      if (cur === 'VND') num = parseFloat(s.replace(/[^\d]/g, ''));
      else num = parseFloat(s.replace(/[^\d.]/g, ''));
      return isNaN(num) || num === 0 ? null : { cur, val: num };
    }

    function formatTotals(totals) {
      const fmt = { USD: v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                    VND: v => Math.round(v).toLocaleString('en-US') + ' ₫',
                    JPY: v => '¥' + Math.round(v).toLocaleString('en-US'),
                    OTHER: v => v.toLocaleString('en-US') };
      const parts = Object.keys(totals).filter(k => totals[k]).map(k => fmt[k](totals[k]));
      return parts.length ? parts.join('<br>') : '-';
    }

    function renderClientSummary(list) {
      const map = {};
      list.forEach(p => {
        const key = p.client || t('cs.noClient');
        const m = map[key] || (map[key] = { client: key, projects: 0, active: 0, won: 0, lost: 0, totals: {} });
        const n = parseInt(p.stage, 10);
        m.projects++;
        if (n >= 3 && n <= 6) m.won++;
        else if (n === 9) m.lost++;
        if (n <= 5) m.active++;
        const a = parseAmount(p.orderAmount);
        if (a && n >= 3 && n <= 6) m.totals[a.cur] = (m.totals[a.cur] || 0) + a.val;
      });
      const rows = Object.values(map).sort((a, b) => (b.won - a.won) || (b.projects - a.projects) || a.client.localeCompare(b.client));
      if (rows.length === 0) return `<div class="pj-empty">${esc(t('pj.none'))}</div>`;
      const body = rows.map(r => {
        const closed = r.won + r.lost;
        const rate = closed ? Math.round(r.won / closed * 100) + '%' : '-';
        return `<tr class="clickable" onclick="filterByClient(${esc(JSON.stringify(r.client))})">
          <td>${esc(r.client)}</td><td class="num">${r.projects}</td><td class="num">${r.active}</td>
          <td class="num">${r.won}</td><td class="num">${r.lost}</td><td class="num">${rate}</td>
          <td class="num">${formatTotals(r.totals)}</td></tr>`;
      }).join('');
      return `<table class="pj-table"><thead><tr>
          <th>${esc(t('pj.colClient'))}</th><th class="num">${esc(t('cs.projects'))}</th><th class="num">${esc(t('cs.active'))}</th>
          <th class="num">${esc(t('cs.won'))}</th><th class="num">${esc(t('cs.lost'))}</th><th class="num">${esc(t('cs.winRate'))}</th>
          <th class="num">${esc(t('cs.amount'))}</th>
        </tr></thead><tbody>${body}</tbody></table>
        <div style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">${esc(t('cs.note'))}</div>`;
    }

    // 客先別集計の行をクリック → その客先の物件一覧へ
    function filterByClient(client) {
      document.getElementById('pjSearch').value = client === t('cs.noClient') ? '' : client;
      document.getElementById('pjStageFilter').value = 'ALL';
      setProjectsTab('list');
    }

    let pjLoaded = { amount: '', stage: '' };   // 物件の画面を開いたときの値（手で変えたかの判定用）
    function openProjectModal(projectNo, keepInputs) {
      const p = projectsData.find(x => x.projectNo === projectNo);
      if (!p) return;
      selectedProjectNo = projectNo;
      document.getElementById('pjModalTitle').textContent = `${p.projectNo}  ${p.name}`;
      document.getElementById('pjFolderLink').href = p.folderUrl || '#';
      if (!keepInputs) {
        document.getElementById('pjName').value = p.name || '';
        document.getElementById('pjClient').value = p.client || '';
        document.getElementById('pjContact').value = p.contact || '';
        document.getElementById('pjStage').value = p.stage || '1. Inquiry';
        document.getElementById('pjDelivery').value = p.deliveryDate || '';
        document.getElementById('pjNewMemo').value = '';
      }
      // 再読み込み時（見積の受注などで段階・受注金額が自動で変わったとき）は、手で触っていない欄だけ新しい値にする
      const amountEl = document.getElementById('pjAmount'), stageEl = document.getElementById('pjStage');
      if (!keepInputs || amountEl.value === pjLoaded.amount) amountEl.value = p.orderAmount || '';
      if (keepInputs && stageEl.value === pjLoaded.stage) stageEl.value = p.stage || '1. Inquiry';
      pjLoaded = { amount: p.orderAmount || '', stage: p.stage || '1. Inquiry' };
      document.getElementById('pjCategory').value = categoryLabel(p.category);
      document.getElementById('pjSales').value = p.salesPerson || '';
      document.getElementById('pjMemoHistory').textContent = p.memo || t('f.noHistory');

      const ql = document.getElementById('pjQuoteList');
      const quotes = p.quotes || [];
      ql.innerHTML = quotes.length ? '' : `<div class="pj-empty" style="padding: 12px;">${esc(t('pj.noQuotes'))}</div>`;
      quotes.forEach(q => {
        const row = document.createElement('div');
        row.className = 'pj-quote-row';
        row.onclick = () => openEditModal(q.quoteNo);
        row.innerHTML = `<div><b>${esc(q.quoteNo)}</b> <span style="color: var(--text-muted);">${esc(q.details || '')}</span></div>
          <div style="display: flex; gap: 8px; align-items: center;"><span>${esc(q.amount && q.amount !== '0' ? q.amount : '')}</span>
          <span class="tag tag-draft">${esc(statusLabel(q.status))}</span></div>`;
        ql.appendChild(row);
      });

      const isOwner = !!currentUser.isAdmin || salesMatches(p.salesPerson, currentUser.name);
      document.getElementById('pjReadOnlyBanner').style.display = isOwner ? 'none' : 'block';
      document.getElementById('pjSaveBtn').style.display = isOwner ? 'block' : 'none';
      document.getElementById('pjAddQuoteBox').style.display = isOwner ? 'flex' : 'none';
      document.getElementById('pjMemoGroup').style.display = isOwner ? 'flex' : 'none';
      document.getElementById('pjAddBranchBox').style.display = isOwner ? 'flex' : 'none';
      ['pjName', 'pjClient', 'pjContact', 'pjStage', 'pjDelivery', 'pjAmount'].forEach(id => document.getElementById(id).disabled = !isOwner);
      // 親会社の物件は客先を KATZ JP に固定
      const isJp = String(p.projectNo).startsWith('JP');
      const pjClient = document.getElementById('pjClient');
      pjClient.readOnly = isJp;
      pjClient.classList.toggle('form-readonly', isJp);
      updateContactList(document.getElementById('pjClient').value);
      document.getElementById('projectModalOverlay').classList.add('active');
    }

    function closeProjectModal() {
      document.getElementById('projectModalOverlay').classList.remove('active');
      selectedProjectNo = null;
    }

    async function saveProjectInfo() {
      if (!selectedProjectNo) return;
      const client = document.getElementById('pjClient').value;
      if (!String(selectedProjectNo).startsWith('JP') && isJpClientName(client)) {
        alert(t('pj.jpClientOnly', { c: jpClient }));
        return;
      }
      const btn = document.getElementById('pjSaveBtn');
      btn.disabled = true;
      btn.textContent = t('btn.saving');
      try {
        const res = await api('updateProjectInfo', {
          projectNo: selectedProjectNo,
          name: document.getElementById('pjName').value,
          client: client,
          contact: document.getElementById('pjContact').value,
          stage: document.getElementById('pjStage').value,
          deliveryDate: document.getElementById('pjDelivery').value,
          orderAmount: document.getElementById('pjAmount').value,
          memo: document.getElementById('pjNewMemo').value
        });
        if (res.status === 'success') {
          closeProjectModal();
          await fetchProjects();
        } else {
          alert(t('err.update') + res.message);
        }
      } catch (e) {
        if (e.message !== 'AUTH') alert(t('err.network'));
      } finally {
        btn.disabled = false;
        btn.textContent = t('btn.save');
      }
    }

    async function submitAddQuote() {
      if (!selectedProjectNo) return;
      if (!confirm(t('pj.addQuoteConfirm', { no: selectedProjectNo }))) return;
      const projectNo = selectedProjectNo;
      showLoading('loading.creating');
      try {
        const res = await api('addQuoteToProject', { projectNo: projectNo, tradeType: document.getElementById('pjAddQuoteTrade').value });
        if (res.status === 'success') {
          await Promise.all([fetchProjects(), fetchLatestProjects()]);
          showConfirmModal('confirm.created', t('confirm.desc', { no: esc(res.quoteNo) }), res.fileUrl);
        } else {
          alert(t('err.create') + res.message);
        }
      } catch (e) {
        if (e.message !== 'AUTH') alert(t('err.network'));
      } finally {
        hideLoading();
      }
    }

    // 新規物件
    function openCreateModal() {
      document.getElementById('createName').value = '';
      document.getElementById('createClient').value = '';
      document.getElementById('createContact').value = '';
      document.getElementById('createCategory').value = 'domestic';
      document.getElementById('createDeliveryDate').value = '';
      updateContactList('');
      document.getElementById('createTradeType').value = 'Direct';
      document.getElementById('createError').style.display = 'none';
      onCreateCategoryChange();
      document.getElementById('createModalOverlay').classList.add('active');
      setTimeout(() => document.getElementById('createName').focus(), 50);
    }

    // 区分「親会社」⇔ 客先「KATZ JP」を連動させる
    function setCreateClientLocked(locked) {
      const el = document.getElementById('createClient');
      el.readOnly = locked;
      el.classList.toggle('form-readonly', locked);
    }
    function onCreateCategoryChange() {
      const cat = document.getElementById('createCategory');
      const client = document.getElementById('createClient');
      if (cat.value === 'hq') {
        client.value = jpClient;
        setCreateClientLocked(true);
      } else {
        if (isJpClientName(client.value)) client.value = '';
        setCreateClientLocked(false);
      }
      updateContactList(client.value);
    }
    function onCreateClientInput() {
      const client = document.getElementById('createClient');
      if (isJpClientName(client.value)) {
        client.value = jpClient;
        document.getElementById('createCategory').value = 'hq';
        setCreateClientLocked(true);
      }
      updateContactList(client.value);
    }

    function closeCreateModal() {
      document.getElementById('createModalOverlay').classList.remove('active');
    }

    async function submitCreateProject() {
      const name = document.getElementById('createName').value.trim();
      if (!name) {
        const err = document.getElementById('createError');
        err.textContent = t('pj.nameRequired');
        err.style.display = 'block';
        return;
      }
      const cat = document.getElementById('createCategory').value;
      const payload = {
        name: name,
        client: document.getElementById('createClient').value.trim(),
        contact: document.getElementById('createContact').value.trim(),
        quoteFormat: cat === 'hq' ? 'JP' : 'VN',
        isDomestic: cat === 'domestic' ? '国内(Domestic)' : '輸出(Overseas)',
        tradeType: document.getElementById('createTradeType').value,
        deliveryDate: document.getElementById('createDeliveryDate').value
      };

      closeCreateModal();
      showLoading('loading.creating');
      try {
        const res = await api('createProject', payload);
        if (res.status === 'success') {
          await Promise.all([fetchProjects(), fetchLatestProjects()]);
          showConfirmModal('pj.created', t('pj.createdWithQuoteDesc', { no: esc(res.projectNo), q: esc(res.quoteNo) }), res.fileUrl, null, res.folderUrl);
        } else {
          alert(t('err.create') + res.message);
        }
      } catch (err) {
        if (err.message !== 'AUTH') alert(t('err.network'));
      } finally {
        hideLoading();
      }
    }

    // 枝番を追加
    function nextBranchNo(projectNo) {
      const base = projectBase(projectNo);
      let max = 0;
      projectsData.forEach(p => {
        if (p.projectNo.length === base.length + 2 && p.projectNo.startsWith(base)) max = Math.max(max, parseInt(p.projectNo.slice(-2), 10) || 0);
      });
      return base + String(max + 1).padStart(2, '0');
    }
    function openBranchModal() {
      const p = projectsData.find(x => x.projectNo === selectedProjectNo);
      if (!p) return;
      const root = projectsData.find(x => x.projectNo === projectBase(p.projectNo) + '01') || p;
      document.getElementById('branchModalTitle').textContent = t('pj.branchTitle', { no: p.projectNo });
      document.getElementById('branchModalDesc').textContent = t('pj.branchDesc', { next: nextBranchNo(p.projectNo) });
      document.getElementById('branchName').value = (root.name || '') + t('pj.branchSuffix');
      document.getElementById('branchClient').value = p.client || '';
      document.getElementById('branchContact').value = p.contact || '';
      document.getElementById('branchDelivery').value = '';
      document.getElementById('branchTradeType').value = 'Direct';
      updateContactList(p.client);
      document.getElementById('branchModalOverlay').classList.add('active');
    }
    function closeBranchModal() {
      document.getElementById('branchModalOverlay').classList.remove('active');
    }
    async function submitAddBranch() {
      const projectNo = selectedProjectNo;
      if (!projectNo) return;
      const payload = {
        projectNo: projectNo,
        name: document.getElementById('branchName').value.trim(),
        contact: document.getElementById('branchContact').value.trim(),
        deliveryDate: document.getElementById('branchDelivery').value,
        tradeType: document.getElementById('branchTradeType').value
      };
      closeBranchModal();
      closeProjectModal();
      showLoading('loading.creating');
      try {
        const res = await api('addBranch', payload);
        if (res.status === 'success') {
          await Promise.all([fetchProjects(), fetchLatestProjects()]);
          showConfirmModal('pj.created', t('pj.createdWithQuoteDesc', { no: esc(res.projectNo), q: esc(res.quoteNo) }), res.fileUrl, null, res.folderUrl);
        } else {
          alert(t('err.create') + res.message);
        }
      } catch (e) {
        if (e.message !== 'AUTH') alert(t('err.network'));
      } finally {
        hideLoading();
      }
    }

    function showLoading(key) {
      document.getElementById('loadingText').textContent = t(key);
      document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    function showConfirmModal(headerKey, descHtml, url, openBtnKey, folderUrl) {
      document.getElementById('confirmModalHeader').textContent = t(headerKey);
      document.getElementById('confirmModalDesc').innerHTML = descHtml;
      document.getElementById('openSpreadsheetBtn').textContent = t(openBtnKey || 'btn.openSheet');
      const fileUrl = url;
      const folderBtn = document.getElementById('openFolderBtn');
      folderBtn.style.display = folderUrl ? '' : 'none';
      folderBtn.onclick = () => {
        if (folderUrl) window.open(folderUrl, '_blank', 'noopener');
        closeConfirmModal();
      };

      document.getElementById('openSpreadsheetBtn').onclick = () => {
        if (fileUrl) window.open(fileUrl, '_blank', 'noopener');
        closeConfirmModal();
      };
      document.getElementById('confirmModalOverlay').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
