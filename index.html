<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Projects</title>
  <style>
    :root {
      --bg-sidebar: #F7F7F5;
      --bg-main: #FFFFFF;
      --bg-hover: rgba(55, 53, 47, 0.08);
      --text-main: #37352F;
      --text-muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.09);
      --btn-blue: #2383E2;
      --tag-default: #E3E2E0;
      --tag-blue: #D3E5EF;
      --tag-orange: #FADEC9;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
    }
    
    /* サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }
    .workspace-switcher {
      padding: 4px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .workspace-switcher:hover {
      background-color: var(--bg-hover);
    }
    .logo-icon {
      width: 22px;
      height: 22px;
      background-color: var(--text-main);
      color: #FFF;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    .nav-item {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background-color: var(--bg-hover);
    }
    .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
      font-weight: 500;
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      justify-content: space-between;
    }
    .page-title {
      font-size: 16px;
      font-weight: 600;
    }
    .create-btn {
      background-color: var(--btn-blue);
      color: #FFF;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .create-btn:hover {
      background-color: #1A73CC;
    }
    
    /* カンバンボード */
    .board-container {
      padding: 32px 48px;
      flex: 1;
      overflow-x: auto;
    }
    .kanban-board {
      display: flex;
      gap: 16px;
      min-width: 900px;
      height: 100%;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .badge {
      background: var(--tag-default);
      padding: 0 6px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
    }

    /* カード */
    .card {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      box-shadow: rgba(15, 15, 15, 0.05) 0px 1px 2px;
      cursor: pointer;
    }
    .card:hover {
      background-color: var(--bg-sidebar);
    }
    .c-id {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .c-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .c-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text-main);
    }
    .tag-draft { background-color: var(--tag-default); }
    .tag-sub { background-color: var(--tag-blue); }
    .tag-alert { background-color: var(--tag-orange); }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="workspace-switcher">
      <div class="logo-icon">B</div>
      Buddy
    </div>
    <div class="nav-item">🏠 Dashboard</div>
    <div class="nav-item active">📂 Projects</div>
    <div class="nav-item">📅 Schedules</div>
  </nav>

  <main class="main-content">
    <header class="header">
      <div class="page-title">Projects</div>
      <button class="create-btn">New</button>
    </header>
    
    <div class="board-container">
      <div class="kanban-board">
        
        <!-- Draft列 -->
        <div class="column">
          <div class="col-header"><span class="badge">1</span> 1. Draft</div>
          <div class="card">
            <div class="c-id">2609000101-01</div>
            <div class="c-title">後藤様邸 / $0.0</div>
            <div class="c-tags"><span class="tag tag-draft">Domestic</span></div>
          </div>
        </div>

        <!-- Submitted列 -->
        <div class="column">
          <div class="col-header"><span class="badge">1</span> 2. Submitted</div>
          <div class="card">
            <div class="c-id">2609000301-01</div>
            <div class="c-title">ABCDFRR / 10,000,000 VND</div>
            <div class="c-tags"><span class="tag tag-sub">Direct</span></div>
          </div>
        </div>

        <!-- Negotiating列 -->
        <div class="column">
          <div class="col-header"><span class="badge">1</span> 3. Negotiating</div>
          <div class="card">
            <div class="c-id">2609000201-01</div>
            <div class="c-title">てすとおおおお / $0.0</div>
            <div class="c-tags"><span class="tag tag-alert">⚠️ Deadline: 10/22</span></div>
          </div>
        </div>

        <!-- Accepted列 -->
        <div class="column">
          <div class="col-header"><span class="badge">0</span> 4. Accepted</div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
