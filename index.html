<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Sales & Operations</title>
  <style>
    :root {
      --sidebar-bg: #1D5B8F;
      --sidebar-active: #2B76BC;
      --bg-color: #F4F7FE;
      --card-bg: #FFFFFF;
      --text-main: #2B3674;
      --text-muted: #A3AED0;
      --accent-orange: #FF7043;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
    }
    
    /* サイドバー */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: #FFF;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }
    .logo-area {
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .logo-icon {
      background-color: rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 20px;
    }
    .nav-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item {
      padding: 14px 20px;
      color: #D1E0F0;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .nav-item.active {
      background-color: var(--sidebar-active);
      color: #FFF;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
    }
    .create-btn {
      background-color: var(--sidebar-bg);
      color: #FFF;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(29, 91, 143, 0.3);
      transition: transform 0.1s;
    }
    .create-btn:active {
      transform: scale(0.98);
    }
    
    /* カンバンボードエリア */
    .content-area {
      padding: 0 32px 32px;
      overflow-x: auto;
      height: calc(100% - 80px);
    }
    .kanban-board {
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 1000px;
    }
    .kanban-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .column-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      background-color: #E2E8F0;
      color: #4A5568;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    /* カードデザイン */
    .kanban-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .kanban-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border-color: #E2E8F0;
    }
    .card-id {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-client {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .card-amount {
      font-size: 14px;
      color: #4A5568;
      font-weight: 600;
    }
    
    /* アラートタグ */
    .tag-alert {
      display: inline-block;
      background-color: rgba(255, 112, 67, 0.1);
      color: var(--accent-orange);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- サイドバー -->
  <nav class="sidebar">
    <div class="logo-area">
      <div class="logo-icon">B</div>
      Buddy
    </div>
    <ul class="nav-menu">
      <li class="nav-item">📊 Dashboard</li>
      <li class="nav-item active">📁 Projects</li>
      <li class="nav-item">📅 Schedules</li>
    </ul>
  </nav>

  <!-- メインエリア -->
  <main class="main-content">
    <header class="header">
      <div class="page-title">Projects</div>
      <button class="create-btn">+ Create New</button>
    </header>
    
    <section class="content-area">
      <div class="kanban-board">
        
        <!-- Draft列 -->
        <div class="kanban-column">
          <div class="column-title">1. Draft <span class="badge">1</span></div>
          <div class="kanban-card">
            <div class="card-id">2609000101-01</div>
            <div class="card-client">後藤様邸</div>
            <div class="card-amount">$0.0</div>
          </div>
        </div>

        <!-- Submitted列 -->
        <div class="kanban-column">
          <div class="column-title">2. Submitted <span class="badge">1</span></div>
          <div class="kanban-card">
            <div class="card-id">2609000301-01</div>
            <div class="card-client">ABCDFRR</div>
            <div class="card-amount">10,000,000 VND</div>
          </div>
        </div>

        <!-- Negotiating列 -->
        <div class="kanban-column">
          <div class="column-title">3. Negotiating <span class="badge">1</span></div>
          <div class="kanban-card">
            <div class="card-id">2609000201-01</div>
            <div class="card-client">てすとおおおお</div>
            <div class="card-amount">$0.0</div>
            <div class="tag-alert">⚠️ Deadline: 2026-10-22</div>
          </div>
        </div>

        <!-- Accepted列 -->
        <div class="kanban-column">
          <div class="column-title">4. Accepted <span class="badge">0</span></div>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
