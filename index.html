<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Projects</title>
  <style>
    :root {
      --bg-sidebar: #F7F7F5;
      --bg-main: #FFFFFF;
      --bg-hover: rgba(55, 53, 47, 0.08);
      --text-main: #37352F;
      --text-muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.09);
      --btn-blue: #2383E2;
      --tag-default: #E3E2E0;
      --tag-blue: #D3E5EF;
      --tag-orange: #FADEC9;
      /* 全体の基本フォント（A案） */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      /* ロゴ用のセリフ体フォント（B案） */
      --font-serif: Lyon-Text, Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
    }
    
    /* サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }
    
    /* ロゴエリア（B案 ＆ スタイル2適用） */
    .workspace-switcher {
      padding: 8px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .workspace-switcher:hover {
      background-color: var(--bg-hover);
    }
    .logo-text {
      font-family: var(--font-serif); /* B案：セリフ体 */
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo-icon-svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    /* ナビゲーションメニュー */
    .nav-item {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .nav-item:hover {
      background-color: var(--bg-hover);
    }
    .nav-item.active {
      background-color: var(--bg-hover);
      color: var(--text-main);
      font-weight: 500;
    }

    /* メインコンテンツ（省略・既存のカンバンUIがここに入ります） */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      justify-content: center;
      align-items: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <!-- スタイル2: 3Dキューブアイコン ＋ B案: セリフ体フォント -->
    <div class="workspace-switcher">
      <svg class="logo-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 35 L50 20 L80 35 L80 70 L50 85 L20 70 Z" fill="#000000"/>
        <path d="M23 35 L50 22 L77 35 L50 48 Z" fill="#FFFFFF"/>
        <path d="M23 38 L48 50 L48 80 L23 68 Z" fill="#FFFFFF"/>
        <path d="M52 50 L77 38 L77 68 L52 80 Z" fill="#E3E2E0"/>
        <!-- 座標(x,y)とテキストの配置基準(text-anchor)を修正 -->
        <text x="35.5" y="45" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#000000" text-anchor="middle" transform="skewY(25)">B</text>
      </svg>
      <div class="logo-text">Buddy</div>
    </div>

    <div class="nav-item">🏠 Dashboard</div>
    <div class="nav-item active">📂 Projects</div>
    <div class="nav-item">📅 Schedules</div>
  </nav>

  <main class="main-content">
    <p>（ここに前回作成したカンバンボードのHTMLが入ります）</p>
  </main>

</body>
</html>
