<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotation Workspace — KATZDEN VIETNAM</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #ffffff;
      --text-main: #37352f;
      --text-muted: #787774;
      --text-placeholder: #9b9a97;
      --border-subtle: #edece9;
      --border-focus: #2eaadc;
      --hover-bg: #efefed;
      --btn-dark: #232323;
      --btn-dark-hover: #000000;
      --accent-red: #c9171e;
      --callout-bg: #f7f6f3;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .notion-cover {
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, #f1f1ef 0%, #e8e7e4 100%);
      border-bottom: 1px solid var(--border-subtle);
    }

    .notion-page {
      width: 100%;
      max-width: 680px;
      padding: 0 40px 80px 40px;
      position: relative;
    }

    .notion-icon-wrap {
      width: 72px;
      height: 72px;
      margin-top: -36px;
      margin-bottom: 20px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(15, 15, 15, 0.05);
      font-size: 34px;
    }

    .notion-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
    }

    .notion-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      line-height: 1.25;
    }

    .notion-properties {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 28px;
    }

    .prop-row {
      display: flex;
      align-items: center;
      min-height: 32px;
      font-size: 14px;
    }

    .prop-name {
      width: 150px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .prop-value {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notion-input {
      width: 100%;
      max-width: 260px;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      background: #fafaf9;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      outline: none;
      transition: all 0.15s ease;
    }

    .notion-input:focus {
      background: #ffffff;
      border-color: #2383e2;
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.15);
    }

    .radio-group {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    
    .calc-value {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      background: var(--hover-bg);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .notion-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: var(--btn-dark);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.1);
    }
    .notion-btn:hover { background: var(--btn-dark-hover); }
    .notion-btn:disabled { background: #e9e9e7; color: var(--text-placeholder); cursor: not-allowed; box-shadow: none; }

    .notion-user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--hover-bg);
      padding: 4px 10px 4px 6px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
    }

    .user-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-red);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .btn-switch-user {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }

    .notion-callout {
      display: none;
      background: var(--callout-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 16px 18px;
      margin-top: 24px;
      text-align: left;
    }
    .callout-header { font-size: 13px; font-weight: 600; color: #287a4d; margin-bottom: 6px; }
    .callout-body { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .callout-deadline { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    .deadline-date { font-weight: 600; color: var(--accent-red); }

    .link-notion-style {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #2383e2;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 10px;
      background: #ffffff;
      border: 1px solid #d3e5f7;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .link-notion-style:hover { background: #f0f7fe; }

    .status-msg { margin-top: 14px; font-size: 13px; color: var(--text-muted); min-height: 20px; }
    .status-msg.error { color: #eb5757; }
    .status-msg.success { color: #287a4d; font-weight: 500; }

    .spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spin.dark {
      border-color: rgba(0,0,0,0.1);
      border-top-color: #37352f;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ★ 追加: 検索ビューのスタイル */
    .notion-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 40px 0 24px 0;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .search-box-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-box-wrap .notion-input {
      max-width: 100%;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
    }
    .btn-secondary:hover {
      background: var(--hover-bg);
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-card {
      padding: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background: #ffffff;
      transition: background 0.15s;
    }
    .result-card:hover {
      background: #fafaf9;
    }

    .rc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .rc-quote-no {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      color: #1a5734;
      text-decoration: none;
    }
    .rc-quote-no:hover { text-decoration: underline; }

    .rc-status {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--hover-bg);
      border-radius: 4px;
      font-weight: 500;
      color: var(--text-main);
    }
    
    .rc-status.submitted { background: #d3e5f7; color: #1d73c9; }
    .rc-status.negotiating { background: #fdf3c6; color: #b26b00; }
    .rc-status.in-production { background: #dcfce7; color: #166534; }

    .rc-client {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .rc-details {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .rc-footer {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .rc-deadline { color: var(--accent-red); font-weight: 500; }

  </style>
</head>
<body>

  <div class="notion-cover"></div>

  <div class="notion-page">
    <div class="notion-icon-wrap">📋</div>

    <div class="notion-breadcrumb">
      <span class="status-dot"></span>
      <span>KATZDEN VIETNAM</span>
      <span>/</span>
      <span>Sales & Operations</span>
    </div>

    <h1 class="notion-title">Quotation Workspace</h1>

    <!-- 1. ログイン -->
    <div id="loginView">
      <div class="notion-properties">
        <div class="prop-row">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Employee ID</span>
          </div>
          <div class="prop-value">
            <input type="text" id="empId" class="notion-input" placeholder="社員番号 (例: 0001)" autocomplete="off">
          </div>
        </div>
      </div>
      <button class="notion-btn" id="btnLogin">ログイン</button>
    </div>

    <!-- 2. ダッシュボード -->
    <div id="dashView" style="display: none;">
      <!-- 作成エリア -->
      <div class="notion-properties">
        <div class="prop-row">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Created by</span>
          </div>
          <div class="prop-value">
            <div class="notion-user-badge">
              <span class="user-avatar" id="avatarLetter">T</span>
              <span id="dispName">--</span>
            </div>
            <button class="btn-switch-user" id="btnLogout">切替</button>
          </div>
        </div>

        <div class="prop-row">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>
            <span>Category</span>
          </div>
          <div class="prop-value">
            <div class="radio-group">
              <label><input type="radio" name="isDomestic" value="true" checked> 国内案件</label>
              <label><input type="radio" name="isDomestic" value="false"> 輸出</label>
            </div>
          </div>
        </div>

        <div class="prop-row" id="deliveryRow">
          <div class="prop-name">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Delivery Date</span>
          </div>
          <div class="prop-value">
            <input type="date" id="deliveryDate" class="notion-input" style="width: 150px;">
            <span class="calc-value" id="calcPreview">自動計算</span>
          </div>
        </div>
      </div>

      <button class="notion-btn" id="btnCreate">
        <div class="spin" id="btnSpinner"></div>
        <span id="btnText">＋ 新規見積書を作成</span>
      </button>

      <div class="notion-callout" id="resultBox">
        <div class="callout-header">✓ 生成完了</div>
        <div class="callout-body" id="dispQuoteNo"></div>
        <div class="callout-deadline" id="dispDeadlineWrap" style="display:none;">
          ⚠️ 手配期限: <span class="deadline-date" id="dispDeadlineDate"></span>
        </div>
        <a href="#" target="_blank" class="link-notion-style" id="linkOpenSheet">
          <span>スプレッドシートを開く</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <!-- ★追加: 検索・進捗ビュー -->
      <div class="notion-divider"></div>
      
      <div class="search-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Database Search</span>
      </div>
      
      <div class="search-box-wrap">
        <input type="text" id="searchInput" class="notion-input" placeholder="物件番号や顧客名を入力..." autocomplete="off">
        <button class="notion-btn btn-secondary" id="btnSearch">
          <div class="spin dark" id="searchSpinner" style="display:none;"></div>
          <span id="searchText">検索</span>
        </button>
      </div>

      <div class="result-list" id="searchResultList">
        <!-- 検索結果がここに挿入されます -->
      </div>
    </div>
  </div>

<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzlzuj_8xAACqthJVYtLjq2wNLwdhUxmuf5yhgP0aQkpofW9LZ4naRDqypZa_MVtRhA/exec";
  const API_SECRET = "open ss1 rand kz";

  const STAFF_MASTER = {
    "0001": { name: "Tetsuya Goto", position: "Director" },
    "0002": { name: "Nguyen Tien Thinh", position: "Deputy Director" }
  };

  const loginView = document.getElementById("loginView");
  const dashView = document.getElementById("dashView");
  const empIdInput = document.getElementById("empId");
  const btnLogin = document.getElementById("btnLogin");
  const btnLogout = document.getElementById("btnLogout");
  const dispName = document.getElementById("dispName");
  const avatarLetter = document.getElementById("avatarLetter");
  const statusMsg = document.getElementById("statusMsg");

  // 作成用
  const btnCreate = document.getElementById("btnCreate");
  const btnSpinner = document.getElementById("btnSpinner");
  const btnText = document.getElementById("btnText");
  const resultBox = document.getElementById("resultBox");
  const dispQuoteNo = document.getElementById("dispQuoteNo");
  const linkOpenSheet = document.getElementById("linkOpenSheet");
  const deliveryDateInput = document.getElementById("deliveryDate");
  const radioDomestic = document.querySelectorAll('input[name="isDomestic"]');
  const deliveryRow = document.getElementById("deliveryRow");
  const dispDeadlineWrap = document.getElementById("dispDeadlineWrap");
  const dispDeadlineDate = document.getElementById("dispDeadlineDate");

  // 検索用
  const btnSearch = document.getElementById("btnSearch");
  const searchInput = document.getElementById("searchInput");
  const searchSpinner = document.getElementById("searchSpinner");
  const searchText = document.getElementById("searchText");
  const searchResultList = document.getElementById("searchResultList");

  let currentUser = null;

  // ラジオボタンの切り替え
  radioDomestic.forEach(radio => {
    radio.addEventListener('change', (e) => {
      if(e.target.value === "true") deliveryRow.style.display = "flex";
      else { deliveryRow.style.display = "none"; deliveryDateInput.value = ""; }
    });
  });

  const savedEmpId = localStorage.getItem("kz_emp_id");
  if (savedEmpId && STAFF_MASTER[savedEmpId]) loginAs(savedEmpId);

  btnLogin.addEventListener("click", () => {
    const id = empIdInput.value.trim();
    if (!id) { showStatus("社員番号を入力してください", "error"); return; }
    if (STAFF_MASTER[id]) {
      localStorage.setItem("kz_emp_id", id);
      loginAs(id);
    } else {
      showStatus("該当する社員が見つかりません", "error");
    }
  });

  empIdInput.addEventListener("keypress", (e) => { if (e.key === "Enter") btnLogin.click(); });
  searchInput.addEventListener("keypress", (e) => { if (e.key === "Enter") btnSearch.click(); });

  function loginAs(id) {
    currentUser = STAFF_MASTER[id];
    currentUser.id = id;
    dispName.textContent = currentUser.name;
    avatarLetter.textContent = currentUser.name.charAt(0).toUpperCase();
    loginView.style.display = "none";
    dashView.style.display = "block";
    resultBox.style.display = "none";
    statusMsg.textContent = "";
    
    // ログイン時に自動で最新一覧を取得
    executeSearch("");
  }

  btnLogout.addEventListener("click", () => {
    localStorage.removeItem("kz_emp_id");
    currentUser = null;
    empIdInput.value = "";
    dashView.style.display = "none";
    loginView.style.display = "block";
    statusMsg.textContent = "";
  });

  // --- 見積書作成処理 ---
  btnCreate.addEventListener("click", async () => {
    if (!currentUser) return;
    const isDomestic = document.querySelector('input[name="isDomestic"]:checked').value === "true";
    const deliveryDate = deliveryDateInput.value;

    if(isDomestic && !deliveryDate) { showStatus("国内案件は納入予定日を入力してください", "error"); return; }

    btnCreate.disabled = true;
    btnSpinner.style.display = "inline-block";
    btnText.textContent = "作成中...";
    statusMsg.className = "status-msg";
    statusMsg.textContent = "台帳処理中...";
    resultBox.style.display = "none";
    dispDeadlineWrap.style.display = "none";

    try {
      const response = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "createQuotation", empId: currentUser.id, apiKey: API_SECRET, isDomestic: isDomestic, deliveryDate: deliveryDate })
      });
      const res = await response.json();

      if (res.status === "success") {
        statusMsg.className = "status-msg success";
        statusMsg.textContent = "作成完了";
        dispQuoteNo.textContent = res.quoteNo;
        if(isDomestic && res.orderDeadline) {
          dispDeadlineDate.textContent = res.orderDeadline;
          dispDeadlineWrap.style.display = "block";
        }
        linkOpenSheet.href = res.fileUrl;
        resultBox.style.display = "block";
        window.open(res.fileUrl, "_blank");
        
        // 作成後、一覧をリロード
        executeSearch("");
      } else throw new Error(res.message || "失敗しました");
    } catch (err) {
      statusMsg.className = "status-msg error";
      statusMsg.textContent = err.message;
    } finally {
      btnCreate.disabled = false;
      btnSpinner.style.display = "none";
      btnText.textContent = "＋ 新規見積書を作成";
    }
  });

  function showStatus(text, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.textContent = text;
  }

  // --- 進捗検索処理 ---
  btnSearch.addEventListener("click", () => {
    executeSearch(searchInput.value.trim());
  });

  async function executeSearch(query) {
    btnSearch.disabled = true;
    searchSpinner.style.display = "inline-block";
    searchText.style.display = "none";
    searchResultList.innerHTML = '<div style="font-size:13px; color:var(--text-muted); padding:10px;">検索中...</div>';

    try {
      const response = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "searchProjects", empId: currentUser.id, apiKey: API_SECRET, query: query })
      });
      const res = await response.json();

      if (res.status === "success") {
        renderResults(res.data);
      } else {
        searchResultList.innerHTML = `<div style="color:red; font-size:13px;">エラー: ${res.message}</div>`;
      }
    } catch (err) {
      searchResultList.innerHTML = '<div style="color:red; font-size:13px;">通信エラーが発生しました</div>';
    } finally {
      btnSearch.disabled = false;
      searchSpinner.style.display = "none";
      searchText.style.display = "inline";
    }
  }

  function renderResults(data) {
    if(!data || data.length === 0) {
      searchResultList.innerHTML = '<div style="font-size:13px; color:var(--text-muted); padding:10px;">該当する案件が見つかりません。</div>';
      return;
    }

    searchResultList.innerHTML = data.map(item => {
      // ステータスに応じた色付け
      let statusClass = '';
      const s = item.status.toLowerCase();
      if(s.includes('submitted')) statusClass = 'submitted';
      else if(s.includes('negotiating')) statusClass = 'negotiating';
      else if(s.includes('production') || s.includes('ordered')) statusClass = 'in-production';

      const fileLink = item.fileUrl ? `<a href="${item.fileUrl}" target="_blank" class="rc-quote-no">${item.quoteNo} ↗</a>` : `<span class="rc-quote-no">${item.quoteNo}</span>`;
      
      const deadlineHtml = item.orderDeadline ? `<span class="rc-deadline">手配期限: ${item.orderDeadline}</span>` : '';
      const deliveryHtml = item.deliveryDate ? `<span>納入: ${item.deliveryDate}</span>` : '';

      return `
      <div class="result-card">
        <div class="rc-header">
          ${fileLink}
          <span class="rc-status ${statusClass}">${item.status}</span>
        </div>
        <div class="rc-client">${item.client || '(顧客未入力)'}</div>
        ${item.details ? `<div class="rc-details">${item.details}</div>` : ''}
        <div class="rc-footer">
          ${deliveryHtml}
          ${deadlineHtml}
        </div>
      </div>
      `;
    }).join('');
  }

</script>
</body>
</html>
