<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddy - Sales & Operations</title>
  <style>
    :root {
      --bg-color: #F9FAFB;
      --sidebar-bg: #1E3A8A; /* スマートネイビー */
      --sidebar-text: #E0E7FF;
      --accent-color: #F97316; /* コーラルオレンジ */
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --white: #FFFFFF;
      --border: #E5E7EB;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
    }
    
    /* 左側サイドバー */
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      color: var(--white);
      display: flex;
      flex-direction: column;
    }
    .logo-area {
      padding: 24px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }
    /* bとdがリンクするロゴの簡易表現 */
    .logo-icon {
      font-family: serif;
      font-style: italic;
      color: var(--accent-color);
      font-weight: 900;
    }
    .nav-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .nav-item {
      padding: 16px 24px;
      color: var(--sidebar-text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--white);
      border-left: 4px solid var(--accent-color);
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      height: 64px;
      background-color: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .create-btn {
      background-color: var(--accent-color);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2);
    }
    .content-area {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* カンバンボード */
    .kanban-board {
      display: flex;
      gap: 16px;
      height: 100%;
      min-width: 900px;
    }
    .kanban-column {
      flex: 1;
      background-color: #F3F4F6;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .column-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .kanban-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      cursor: pointer;
    }
    .kanban-card:hover {
      border-color: var(--sidebar-bg);
    }
    .card-title {
      font-weight: bold;
      font-size: 14px;
    }
    .card-client {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .card-alert {
      font-size: 12px;
      color: var(--accent-color);
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- サイドバーナビゲーション -->
  <nav class="sidebar">
    <div class="logo-area">
      <span class="logo-icon">b-d</span> Buddy
    </div>
    <ul class="nav-menu">
      <li class="nav-item">🏠 Dashboard</li>
      <li class="nav-item active">📂 Projects</li>
      <li class="nav-item">📅 Schedules</li>
    </ul>
  </nav>

  <!-- メインエリア -->
  <main class="main-content">
    <header class="header">
      <div class="user-info" style="color: var(--text-muted); font-size: 14px;">
        Employee ID: 10008 | Tetsuya Goto
      </div>
      <button class="create-btn">+ 新規作成 (New Quote)</button>
    </header>
    
    <section class="content-area">
      <!-- カンバンボード -->
      <div class="kanban-board">
        
        <!-- Draft列 -->
        <div class="kanban-column">
          <div class="column-title">1. Draft</div>
          <div class="kanban-card">
            <div class="card-title">2609000101-01</div>
            <div class="card-client">後藤様邸 / $0.0</div>
          </div>
        </div>

        <!-- Submitted列 -->
        <div class="kanban-column">
          <div class="column-title">2. Submitted</div>
          <div class="kanban-card">
            <div class="card-title">2609000301-01</div>
            <div class="card-client">ABCDFRR / 10,000,000 VND</div>
          </div>
        </div>

        <!-- Negotiating列 -->
        <div class="kanban-column">
          <div class="column-title">3. Negotiating</div>
          <!-- 期限アラート付きのカード例 -->
          <div class="kanban-card" style="border-left: 4px solid var(--accent-color);">
            <div class="card-title">2609000201-01</div>
            <div class="card-client">てすとおおおお / $0.0</div>
            <div class="card-alert">⚠️ 手配期限: 2026-10-22</div>
          </div>
        </div>

        <!-- Accepted列 -->
        <div class="kanban-column">
          <div class="column-title">4. Accepted</div>
          <!-- 案件なし -->
        </div>

      </div>
    </section>
  </main>

</body>
</html>
